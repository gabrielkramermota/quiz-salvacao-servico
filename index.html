<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Salvação e Serviço</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
body{margin:0}
/* Layout: coluna única de leitura (máx. 720px); início com dois modos lado a lado, quiz em tela única com feedback imediato */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --fg:#16203A; --muted:#5B6580; --line:#D9DEE8;
  --accent:#2C4A9A; --accent-fg:#FFFFFF; --accent-soft:#E4EAF8;
  --ok:#17794A; --ok-soft:#DDF3E7; --bad:#B3321F; --bad-soft:#F9E0DB;
  --serif:'Source Serif 4',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1524; --surface:#18203A; --fg:#E6EAF5; --muted:#99A3BF; --line:#2B3555;
  --accent:#8FA8F0; --accent-fg:#0F1524; --accent-soft:#222E52;
  --ok:#5FD39A; --ok-soft:#163A2A; --bad:#F08A78; --bad-soft:#40201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#18203A; --fg:#E6EAF5; --muted:#99A3BF; --line:#2B3555;
  --accent:#8FA8F0; --accent-fg:#0F1524; --accent-soft:#222E52;
  --ok:#5FD39A; --ok-soft:#163A2A; --bad:#F08A78; --bad-soft:#40201B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,34px)}
h2{font-size:22px}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:12px 20px;border-radius:8px;font-weight:600;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.chap{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;min-width:0}
.chap:hover{border-color:var(--accent)}
.chap .n{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--accent);min-width:2ch;text-align:center}
.chap .t{font-weight:500;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.chap .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chap .s.done{color:var(--ok);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:16px;font-size:14px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
.opts select{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
/* quiz */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.question{font-family:var(--serif);font-size:clamp(19px,3.4vw,23px);line-height:1.4;font-weight:500;overflow-wrap:anywhere}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);padding:14px;border-radius:10px;min-width:0;align-items:start}
.alt .l{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted)}
.alt span:last-child{overflow-wrap:anywhere}
.alt:not(:disabled):hover{border-color:var(--accent)}
.alt.ok{border-color:var(--ok);background:var(--ok-soft)}
.alt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.alt.bad{border-color:var(--bad);background:var(--bad-soft)}
.alt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.alt:disabled{cursor:default;color:var(--fg)}
.fb{font-weight:600;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:12px}
.rev{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:15px}
.rev .q{font-weight:600;overflow-wrap:anywhere}
.rev .you{color:var(--bad)}.rev .right{color:var(--ok)}
.themebtn{align-self:flex-end;background:none;border:none;color:var(--muted);font-size:13px;padding:4px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<main id="app"></main>

<script>
const DATA = [{"id": 1, "title": "MENSAGEM DE ELIAS", "questions": [{"n": 1, "q": "Em qual passagem bíblica se encontra a promessa do envio do profeta Elias antes do grande e terrível dia do Senhor?", "o": ["Isaías 58:12-14", "Malaquias 4:5-6", "Joel 2:28-29"], "a": 1}, {"n": 2, "q": "Qual é o foco principal da mensagem de Elias segundo o contexto profético?", "o": ["Apenas a restauração da guarda do sábado.", "Unir gerações, restaurar a verdade e advertir sobre a iminente vinda do Senhor.", "Organizar eventos sociais e de recreação para os jovens da igreja."], "a": 1}, {"n": 3, "q": "O que caracteriza a mensagem de Elias em relação ao seu conteúdo doutrinário?", "o": ["É uma mensagem parcial focada apenas no Novo Testamento.", "É uma mensagem integral e completa que abrange o evangelho eterno e a reforma de saúde.", "É um conjunto de regras exclusivamente sociais para os jovens."], "a": 1}, {"n": 4, "q": "De acordo com o livro, qual é a prova da genuínas intenções de uma igreja remanescente?", "o": ["O número de membros baptizados por ano.", "O sucesso e a eficácia do seu ministério junto aos jovens.", "A quantidade de patrimônio físico acumulado."], "a": 1}, {"n": 5, "q": "Qual é o erro de alguns líderes de jovens apontado por Malcolm Allen no Capítulo 1?", "o": ["Lerem demais a Bíblia e o Espírito de Profecia.", "Buscar incentivos nos costumes do mundo e no ministério de igrejas populares.", "Focar excessivamente no ensino da história denominacional."], "a": 1}, {"n": 6, "q": "Qual é o objetivo primário de todo o ministério jovem adventista?", "o": ["Promover o entretenimento saudável dos juvenis.", "Salvar a juventude por meio de Jesus Cristo.", "Arrecadar fundos para missões estrangeiras."], "a": 1}, {"n": 7, "q": "O que acontece quando os líderes focam excessivamente na mecânica dos programas e atividades?", "o": ["O ministério atinge o seu nível máximo de eficiência.", "Perde-se de vista o ministério espiritual, podendo resultar em apostasia.", "Os jovens tornam-se mais fiéis às doutrinas."], "a": 1}, {"n": 8, "q": "Além de recreação e alegria, em quais dois pilares o ministério jovem deve ter seu enfoque básico?", "o": ["Teologia avançada e política.", "Espiritualidade e serviço.", "Esportes e viagens."], "a": 1}, {"n": 9, "q": "A quem se refere o cumprimento da mensagem de Elias no contexto da igreja atual?", "o": ["Apenas aos pastores e evangelistas credenciados.", "Ao povo remanescente de Deus.", "Exclusivamente aos professores de Escolas Sabatinas."], "a": 1}, {"n": 10, "q": "Por que a mensagem de Elias deve ser apresentada em sua totalidade?", "o": ["Para cumprir com os regulamentos administrativos da Associação Geral.", "Porque não fazer isso seria cometer uma injustiça contra a verdade de Deus.", "Para competir com os programas das igrejas populares."], "a": 1}, {"n": 11, "q": "Quem é o agente principal que converterá o coração dos pais aos filhos e dos filhos aos pais?", "o": ["O próprio Deus.", "O diretor de jovens da Associação.", "O sistema educacional adventista."], "a": 0}, {"n": 12, "q": "Como o livro define o ministério jovem em sua essência?", "o": ["Um clube de lazer para a juventude.", "O veículo ordenado por Deus para transportar os jovens em segurança da terra para o céu.", "Uma comissão de auxílio social urbano."], "a": 1}, {"n": 13, "q": "De que maneira a juventude precisa ver a mensagem da igreja para aceitá-la?", "o": ["Como uma teoria filosófica abstrata.", "Vivida na prática pela igreja e por seus membros.", "Imposta através de disciplinas e penalidades severas."], "a": 1}, {"n": 14, "q": "A mensagem de Elias é comparada a qual mensagem do livro de Apocalipse?", "o": ["Às sete trombetas de Apocalipse 8.", "Ao evangelho eterno de Apocalipse 14.", "Ao milênio de Apocalipse 20."], "a": 1}, {"n": 15, "q": "Qual é a postura de um líder jovem comprometido com o alicerce bíblico?", "o": ["Criar seus próprios programas filosóficos.", "Fundamentar seu trabalho nas coisas espirituais de valor eterno.", "Copiar as tendências do entretenimento secular."], "a": 1}, {"n": 16, "q": "O ministério jovem foi idealizado para ser uma instituição de serviços comunitários isolada?", "o": ["Sim, esse é o seu único propósito.", "Não, ele é ordenado por Deus para a salvação da juventude.", "Sim, voltado exclusivamente para não-adventistas."], "a": 1}, {"n": 17, "q": "O que os programas e atividades devem fazer na vida dos jovens?", "o": ["Apenas preencher o tempo vago no sábado à tarde.", "Aprofundar o relacionamento com Deus e focar no alvo do adventismo.", "Promover a competição esportiva entre distritos."], "a": 1}, {"n": 18, "q": "Qual das seguintes opções NÃO é uma característica da mensagem de Elias?", "o": ["Mensagem de esperança e advertência", "Mensagem focada exclusivamente em teorias sociais modernas.", "Mensagem profética para um tempo específico."], "a": 1}, {"n": 19, "q": "Quem é responsável por oferecer aos jovens uma mensagem de esperança que traga paz à alma?", "o": ["A igreja como um todo.", "Apenas a comissão da Associação Geral.", "Somente os pais biológicos."], "a": 0}, {"n": 20, "q": "O que deve permitir aos jovens apreciar a presença de Deus no planeta e na eternidade?", "o": ["A adoção de um estilo de vida cristão por preceito e exemplo.", "Apenas o conhecimento teórico das profecias de Daniel.", "O isolamento total da sociedade secular."], "a": 0}]}, {"id": 2, "title": "FUNDAMENTO BÍBLICO", "questions": [{"n": 1, "q": "Qual texto bíblico citado no Capítulo 2 afirma que os líderes da igreja primitiva não seguiram \"fábulas engenhosamente inventadas\"?", "o": ["I Coríntios 9:26", "II Pedro 1:16", "Isaías 54:13"], "a": 1}, {"n": 2, "q": "Em qual verso bíblico se encontra a promessa: \"Todos os teus filhos serão ensinados do Senhor; e será grande a paz de teus filhos\"?", "o": ["Isaías 54:13", "Deuteronômio 6:7", "Joel 2:28"], "a": 0}, {"n": 3, "q": "Qual o significado literal do nome do filho de Isaías, Shear-jashub?", "o": ["O Senhor é a nossa Justiça.", "Haverá salvação nos remanescentes / Um-Resto-Volverá.", "Deus está conosco."], "a": 1}, {"n": 4, "q": "Em Deuteronômio 6:4-7, a quem Deus está dirigindo Suas instruções para ensinar a Palavra?", "o": ["Apenas aos sacerdotes da tribo de Levi.", "A Israel como um todo (a igreja).", "Somente aos pais biológicos de crianças pequenas."], "a": 1}, {"n": 5, "q": "Qual palavra é utilizada para descrever a forma como a instrução deve ser dada aos filhos em Deuteronômio 6:7 em várias versões bíblicas?", "o": ["Esporadicamente.", "Diligentemente / Inculcarás.", "Teoricamente."], "a": 1}, {"n": 6, "q": "Quais são os três princípios bíblicos do ministério em favor dos jovens apresentados com base em Deuteronômio 6?", "o": ["Organizar, financiar e divertir.", "Instruir, fazer lembrar e desafiar.", "Corrigir, julgar e disciplinar."], "a": 1}, {"n": 7, "q": "O que diz Joel 2:1 a respeito da atitude da igreja nos últimos dias?", "o": ["\"Tocai a trombeta em Sião e fazei soar o alarme.\"", "\"Cantai louvores nas praças públicas.\"", "\"Buscai a sabedoria dos filósofos.\""], "a": 0}, {"n": 8, "q": "O que significa a ordem \"santificai a congregação, ajuntai os anciãos, reuni os filhinhos\" em Joel 2:16?", "o": ["Separar os jovens para reuniões puramente sociais.", "Separar e preparar os jovens para uma atividade santa e para o encontro com Deus.", "Excluir os jovens das decisões administrativas."], "a": 1}, {"n": 9, "q": "Segundo Joel 2:28-29, qual o resultado do derramamento do Espírito Santo sobre os jovens?", "o": ["Eles acumularão riquezas materiais.", "Eles profetizarão e terão visões para proclamar o evangelho.", "Eles assumirão o controle político das nações."], "a": 1}, {"n": 10, "q": "Qual é a recomendação de Efésios 5:1 para os líderes de jovens?", "o": ["\"Sede imitadores dos grandes filósofos.\"", "\"Sede, pois, imitadores de Deus como filhos amados.\"", "\"Sede seguidores das modas do vosso tempo.\""], "a": 1}, {"n": 11, "q": "Qual a palavra grega original para \"imitadores\" mencionada no texto em Efésios 5:1?", "o": ["Agape", "Miméomai", "Koinonia"], "a": 1}, {"n": 12, "q": "De acordo com Efésios 5:3-7, quais atitudes NUNCA devem fazer parte da vida de um líder cristão?", "o": ["Estudo, oração e jejum.", "Impureza, imoralidade, conversação leviana e piadas maliciosas.", "Pregação, ensino e visitação."], "a": 1}, {"n": 13, "q": "A expressão \"fazer soar o alarme no santo monte\" significa alertar sobre o quê?", "o": ["Que o ministério jovem se encontra em estado de emergência espiritual.", "Que haverá uma catástrofe natural iminente nas montanhas.", "Que a igreja precisa mudar de prédio."], "a": 0}, {"n": 14, "q": "Como os adultos podem convencer mais facilmente os jovens a adotarem um estilo de vida cristão?", "o": ["Apresentando teorias complexas cheias de proibições.", "Demonstrando na prática um estilo de vida cristão viável e que funciona.", "Apenas através da imposição de autoridade pastoral."], "a": 1}, {"n": 15, "q": "Qual é o papel das Escrituras na vida dos jovens segundo o Salmo 119:105 citado no capítulo?", "o": ["Servir como livro de história antiga.", "Ser lâmpada para os pés e luz para os caminhos.", "Apenas um manual de regras para os sábados."], "a": 1}, {"n": 16, "q": "O que acontece quando deixamos de apresentar aos jovens uma base bíblica sólida para as nossas normas?", "o": ["Eles tornam-se mais obedientes sem questionar.", "Surge a dúvida e o risco de apostasia quando perguntam \"por quê?\".", "Eles criam seus próprios manuais de doutrina."], "a": 1}, {"n": 17, "q": "Além de ensinar os mandamentos e lembrar o passado, qual é o terceiro dever da igreja para com os jovens em Deuteronômio 6:24?", "o": ["Desafiá-los a viver de acordo com a Palavra do Altíssimo.", "Oferecer-lhes bolsas de estudo seculares.", "Isentá-los de responsabilidades na igreja."], "a": 0}, {"n": 18, "q": "Qual das seguintes passagens afirma que os fiéis são \"sacerdócio real, nação santa, povo de propriedade exclusiva de Deus\"?", "o": ["I Pedro 2:9", "Isaías 54:13", "II Pedro 3:11"], "a": 0}, {"n": 19, "q": "Qual o verdadeiro teste para saber se um ministério jovem é genuíno e embasado biblicamente?", "o": ["A quantidade de curtidas e aplausos nas reuniões.", "A sua eficácia na salvação e no serviço dos jovens.", "O orçamento financeiro que ele consome."], "a": 1}, {"n": 20, "q": "O alvo do ministério jovem (\"A mensagem do advento a todo o mundo em minha geração\") é considerado a essência de qual mensagem?", "o": ["Da mensagem de Elias.", "Do código de Hamurabi.", "Da filosofia grega clássica."], "a": 0}]}, {"id": 3, "title": "MINISTÉRIO JOVEM DA IASD - UMA ANÁLISE", "questions": [{"n": 1, "q": "Em que ano e por quem foi fundada a primeira sociedade de jovens adventista?", "o": ["1852, por Tiago White e Ellen White.", "1879, por Luther Warren e Harry Fenner.", "1907, por M. E. Kern e A. G. Daniells."], "a": 1}, {"n": 2, "q": "Quais eram as idades de Luther Warren e Harry Fenner quando fundaram a primeira sociedade de jovens em Hazelton, Michigan?", "o": ["10 e 12 anos.", "14 e 17 anos.", "20 e 25 anos."], "a": 1}, {"n": 3, "q": "Onde e em que ano foi fundada a segunda sociedade de jovens registrada na história da IASD?", "o": ["Battle Creek, Michigan (1880).", "Mount Vernon, Ohio (1881).", "Washington D.C. (1903)."], "a": 1}, {"n": 4, "q": "Em 1901, sob qual departamento a atenção aos jovens foi colocada inicialmente durante a reorganização da Associação Geral?", "o": ["Departamento de Educação.", "Departamento da Escola Sabatina.", "Departamento de Publicações."], "a": 1}, {"n": 5, "q": "Onde e em que data realizou-se a assembleia da Associação Geral que votou a criação de um departamento separado para os jovens?", "o": ["Gland, Suíça (Maio de 1907).", "Mount Vernon, Ohio (Julho de 1907).", "Battle Creek, Michigan (1901)."], "a": 0}, {"n": 6, "q": "Quem era o presidente da Associação Geral que impulsionou a organização do Departamento de Jovens em 1907?", "o": ["John Byington.", "A. G. Daniells.", "M. E. Kern."], "a": 1}, {"n": 7, "q": "Onde e quando ocorreu a famosa Convenção da Escola Sabatina e dos Jovens que definiu os rumos do novo departamento?", "o": ["Gland, Suíça (1905).", "Mount Vernon, Ohio (Julho de 1907).", "San Francisco, Califórnia (1915)."], "a": 1}, {"n": 8, "q": "Em que ano o departamento dos jovens foi oficialmente organizado como uma entidade separada na Assembleia da Associação Geral?", "o": ["1907", "1908", "1920"], "a": 1}, {"n": 9, "q": "Em que ano e com qual objetivo foi introduzido o Clube de Desbravadores oficializado pela Associação Geral?", "o": ["1922, para jovens universitários.", "1950, para juvenis de 10 a 15 anos.", "1970, para crianças da Educação Infantil."], "a": 1}, {"n": 10, "q": "Qual importante livro do Espírito de Profecia compilado para a juventude foi publicado pelo Patrimônio Ellen G. White em 1930?", "o": ["Caminho a Cristo.", "Mensagens aos Jovens.", "O Grande Conflito."], "a": 1}, {"n": 11, "q": "Como eram chamadas as classes de liderança de jovens introduzidas em 1928 (que mais tarde deram origem ao Curso de Líder)?", "o": ["Master Comrade.", "Guia Maior.", "Líder de Desbravadores."], "a": 0}, {"n": 12, "q": "Na década de 1950, qual ideia difundida na cultura ocidental começou a afetar negativamente as reuniões de jovens de sábado à tarde?", "o": ["A união total entre idosos e jovens.", "A \"lacuna entre gerações\" e o lema \"os jovens com os jovens\", afastando os adultos.", "O fim de todas as publicações impressas."], "a": 1}, {"n": 13, "q": "Quais publicações substituíram a revista The Youth's Instructor na América do Norte a partir do final dos anos 1960?", "o": ["Revista Adventista e Vida Feliz.", "Guide e Insight.", "Nosso Amiguinho e Mocidade."], "a": 1}, {"n": 14, "q": "Em que ano a Associação Geral criou o \"Departamento dos Ministérios da Igreja\", fundindo Jovens, Escola Sabatina, Ação Missionária, Mordomia e Lar e Família?", "o": ["1970", "1985", "1993"], "a": 1}, {"n": 15, "q": "Qual foi uma das consequências negativas da criação do Departamento dos Ministérios da Igreja para o Ministério Jovem?", "o": ["Aumento do orçamento exclusivo para jovens.", "Fragmentação e perda da identidade e liderança especializada do ministério jovem.", "Fim de todos os acampamentos de verão."], "a": 1}, {"n": 16, "q": "Durante os primeiros 40 anos do movimento adventista (1840-1880), qual era a faixa etária da maioria dos pioneiros fundadores?", "o": ["Idosos acima de 70 anos.", "Jovens e adolescentes.", "Apenas adultos de meia-idade."], "a": 1}, {"n": 17, "q": "O que aconteceu na década de 1920 em relação à organização dos juvenis no ministério jovem?", "o": ["Foram criadas as Classes Progressivas (1922) e a Sociedade de Juvenis (1920).", "Os juvenis foram proibidos de frequentar as reuniões da igreja.", "O Ministério Infantil assumiu todo o trabalho de 0 a 18 anos."], "a": 0}, {"n": 18, "q": "Qual movimento cultural da década de 1960 influenciou negativamente a juventude e gerou sementes de ceticismo e dúvida?", "o": ["A Revolução Industrial.", "O Iluminismo Francês.", "A cultura do rock, o movimento hippie/protestos e o liberalismo social."], "a": 2}, {"n": 19, "q": "Qual ponto positivo emergiu no final da década de 1970 e início dos anos 80 no ministério jovem adventista?", "o": ["Uma renovada disposição dos jovens em participar ativamente do evangelismo e do trabalho voluntário.", "A extinção de todos os acampamentos.", "A proibição de jovens no ministério da música."], "a": 0}, {"n": 20, "q": "Segundo o Capítulo 3, o que faltava a muitos novos diretores de jovens nomeados nas décadas de 70 e 80?", "o": ["Títulos universitários seculares.", "Conhecimento da filosofia adventista original do ministério jovem e experiência contínua na área.", "Veículos próprios para viajar pelas Associações."], "a": 1}]}, {"id": 4, "title": "NAS IGREJAS POPULARES", "questions": [{"n": 1, "q": "Qual movimento do século XVIII é considerado a raiz do moderno ministério jovem nas igrejas populares ão dos Jovens Batistas.", "Mocidade Presbiteriana."], "a": 1}, {"n": 10, "q": "O que aconteceu com os movimentos jovens das igrejas populares durante os 30 anos anteriores à Primeira Guerra Mundial?", "o": ["Focaram exclusivamente na guarda do sábado.", "Focaram fortemente no impulso evangelístico e na ação missionária mundial.", "Foram totalmente extintos pelos governos."], "a": 1}, {"n": 11, "q": "Na década de 1930, com qual área as denominações populares tentaram fundir o ministério jovem, alterando seu foco evangelístico?", "o": ["Com a Educação Cristã / Grupos de Companheirismo nas universidades.", "Com os clubes de futebol profissional.", "Com o departamento financeiro da igreja."], "a": 0}, {"n": 12, "q": "O que substituiu a \"conversão\" como objetivo prioritário nos grupos de companheirismo das igrejas populares após a década de 1930?", "o": ["O evangelismo público.", "\"Entender a fé\" (abordagem intelectual e social).", "O batismo por imersão."], "a": 1}, {"n": 13, "q": "O que ocorreu com a estrutura do ministério jovem nas igrejas populares durante a década de 1960?", "o": ["Tornou-se extremamente rígida e doutrinária.", "Desabou devido a protestos, rejeição de autoridade e foco excessivo em entretenimento e questões sociais.", "Alcançou o maior crescimento espiritual da história."], "a": 1}, {"n": 14, "q": "Segundo a pesquisa Valuegenesis mencionada no livro, qual é o estado do ministério jovem nas igrejas populares modernas que abandonaram seus alvos originais?", "o": ["É um sucesso absoluto sem apostasia.", "É duvidoso e carece de um propósito teológico e de um plano geral claro para o crescimento da fé.", "É exatamente igual ao ministério dos pioneiros do século XIX."], "a": 1}, {"n": 15, "q": "Qual revista interdenominacional publicou em setembro de 1993 um artigo descrevendo a falta de consenso e padrão no ministério jovem moderno?", "o": ["Review and Herald.", "Group Magazine.", "Time Magazine."], "a": 1}, {"n": 16, "q": "Diante do cenário de crise nas igrejas populares, qual pergunta a Igreja Adventista devia fazer ao reconstruir seu próprio ministério jovem?", "o": ["Como copiar com mais rapidez as músicas do mundo.", "Se tem sido fiel aos fundamentos bíblicos e às raízes históricas de orientação divina.", "Como eliminar o estudo da Bíblia nas reuniões."], "a": 1}, {"n": 17, "q": "O programa original da Escola Dominical no século XVIII funcionava em qual ciclo temporal?", "o": ["Um ciclo anual.", "Um ciclo mensal (Boas-vindas, Bíblia, Decisão e Convite).", "Um ciclo diário."], "a": 1}, {"n": 18, "q": "O que as igrejas populares temiam quando a Sociedade do Empenho Cristão cresceu assustadoramente no final do século XIX?", "o": ["Que os jovens perdessem o interesse pela música.", "Que os jovens abandonassem suas denominações para se unirem permanentemente à sociedade ou assumissem o comando da igreja.", "Que os jovens se tornassem missionários no exterior."], "a": 1}, {"n": 19, "q": "Qual foi a atitude de muitas igrejas populares nos anos 60 ao entrar em pânico com os protestos dos jovens?", "o": ["Publicaram mais manuais do que nunca.", "Lançaram por terra a estrutura, cancelando publicações, distintivos e grandes congressos.", "Obrigaram os jovens a usar uniformes militares."], "a": 1}, {"n": 20, "q": "O que a maioria das denominações populares atuais concorda sobre o ministério jovem, apesar da falta de padrão?", "o": ["Que deve focar apenas em esportes.", "Que deve centralizar-se na pessoa e não apenas no programa, incluindo mais do que educação e serviço.", "Que não deve existir ministério para jovens na igreja local."], "a": 1}]}, {"id": 5, "title": "MOTIVAÇÃO HISTÓRICA", "questions": [{"n": 1, "q": "Em que ano e durante qual viagem Tiago White teve a impressão de criar lições bíblicas para os jovens?", "o": ["Verão de 1852, viajando de carruagem entre Rochester (NY) e Bangor (Maine).", "Inverno de 1879, viajando para Battle Creek.", "Verão de 1888, durante a assembleia de Minneapolis."], "a": 0}, {"n": 2, "q": "Qual foi o nome da histórica publicação criada por Tiago White em agosto de 1852 para disponibilizar as lições da Escola Sabatina aos jovens?", "o": ["The Advent Review.", "The Youth's Instructor.", "The Signs of the Times."], "a": 1}, {"n": 3, "q": "Qual era o valor da assinatura anual da revista The Youth's Instructor em seu lançamento em 1852?", "o": ["5 centavos.", "25 centavos.", "1 dólar."], "a": 1}, {"n": 4, "q": "Quem foi o professor com experiência em escola dominical que ingressou na igreja de Battle Creek em 1869 e organizou as lições da Escola Sabatina para crianças e jovens?", "o": ["Professor G. H. Bell.", "Professor Frederick Griggs.", "Professor B. G. Wilkenson."], "a": 0}, {"n": 5, "q": "Onde e em que anos foram realizadas as primeiras escolas sabatinas adventistas de que se tem registro?", "o": ["Battle Creek e Mount Vernon (1860).", "Rochester e Bucksbridge, Nova Iorque (1853 e 1854).", "Washington D.C. e Nova York (1890)."], "a": 1}, {"n": 6, "q": "Quem foi o líder da Escola Sabatina em Bucksbridge que posteriormente se tornou o primeiro presidente da Associação Geral?", "o": ["James White.", "John Byington.", "J. N. Andrews."], "a": 1}, {"n": 7, "q": "O primeiro testemunho escrito por Ellen G. White fazendo um apelo direto para que a igreja fizesse algo organizado pelos jovens foi escrito em qual local e data?", "o": ["Battle Creek, Michigan (1879).", "Melbourne, Austrália (19 de dezembro de 1892).", "Santa Helena, Califórnia (1901)."], "a": 1}, {"n": 8, "q": "Na famosa citação de Ellen G. White de 1893, como ela descreve o potencial dos jovens na igreja?", "o": ["\"Temos hoje um exército de jovens que podem fazer muito se forem devidamente encorajados e dirigidos.\"", "\"Os jovens são o futuro incerto da igreja.\"", "\"Os jovens devem apenas assistir aos cultos em silêncio.\""], "a": 0}, {"n": 9, "q": "Em um testemunho publicado na Signs of the Times em 29 de maio de 1893, o que Ellen G. White sugeriu que fosse formado em cada igrej
