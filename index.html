  set(o){ try{ localStorage.setItem('quiz-salvacao-servico', JSON.stringify(o)); }catch(e){} }
};
let ui = { tab:'chapter', shuffleAlts:true, shuffleOrder:false, count:20 };
let run = null;

const el = (h)=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const total = DATA.reduce((n,c)=>n+c.questions.length,0);

function prep(qs){
  let list = ui.shuffleOrder || run?.forceOrder ? shuffle(qs) : qs;
  return list.map(q=>{
    const idx=[0,1,2]; const order = ui.shuffleAlts ? shuffle(idx) : idx;
    return { chap:q.chap, chapTitle:q.chapTitle, n:q.n, q:q.q, o:order.map(i=>q.o[i]), a:order.indexOf(q.a) };
  });
}
const flat = (c)=>c.questions.map(q=>({...q,chap:c.id,chapTitle:c.title}));
function titleCase(s){ return s.toLowerCase().replace(/(^|\s|-)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Da|Do|E|Dos|Das|Para|Nas|Na|No)\b/g,w=>w.toLowerCase()); }

function home(){
  run=null;
  const st = store.get();
  $app.innerHTML='';
  $app.append(el(`<header style="display:flex;flex-direction:column;gap:6px">
    <button class="themebtn" id="theme" type="button">Alternar tema</button>
    <p class="eyebrow">Malcolm Allen · ${total} questões · 17 capítulos</p>
    <h1>Salvação e Serviço</h1>
    <p class="muted">Treino para a prova. Escolha um capítulo ou misture tudo.</p></header>`));
  const tabs = el(`<div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="chapter" aria-selected="${ui.tab==='chapter'}">Por capítulo</button>
    <button class="tab" role="tab" data-t="random" aria-selected="${ui.tab==='random'}">Aleatório</button></div>`);
  $app.append(tabs);
  const opts = el(`<div class="opts">
    <label><input type="checkbox" id="o-alts" ${ui.shuffleAlts?'checked':''}> Embaralhar alternativas</label>
    ${ui.tab==='chapter'?`<label><input type="checkbox" id="o-order" ${ui.shuffleOrder?'checked':''}> Embaralhar ordem das perguntas</label>`:''}
  </div>`);
  if(ui.tab==='chapter'){
    $app.append(opts);
    const g = el('<div class="chapters"></div>');
    DATA.forEach(c=>{
      const s = st['c'+c.id];
      const b = el(`<button class="chap" type="button" data-c="${c.id}">
        <span class="n">${c.id}</span><span class="t">${esc(titleCase(c.title))}</span>
        <span class="s ${s&&s.best===c.questions.length?'done':''}">${s?`${s.best}/${c.questions.length}`:`${c.questions.length} questões`}</span></button>`);
      g.append(b);
    });
    $app.append(g);
    if(Object.keys(st).some(k=>k.startsWith('c'))){
      $app.append(el('<p class="muted" style="font-size:13px">O número à direita é o seu melhor resultado em cada capítulo, salvo neste navegador.</p>'));
    }
  } else {
    const counts=[20,40,60,100,total];
    const p = el(`<section class="panel">
      <h2>Prova aleatória</h2>
      <p class="muted">Perguntas sorteadas de todos os capítulos. Ao responder, você vê de qual capítulo ela veio.</p>
      <div class="opts"><label>Quantidade
        <select id="cnt">${counts.map(n=>`<option value="${n}" ${ui.count===n?'selected':''}>${n===total?`Todas (${total})`:n}</option>`).join('')}</select></label></div>
      <div class="opts"><label><input type="checkbox" id="o-alts" ${ui.shuffleAlts?'checked':''}> Embaralhar alternativas</label></div>
      <div class="row"><button class="btn" id="go" type="button">Começar</button></div></section>`);
    $app.append(p);
  }
  tabs.addEventListener('click',e=>{ const t=e.target.closest('[data-t]'); if(t){ ui.tab=t.dataset.t; home(); } });
  $app.querySelector('#o-alts')?.addEventListener('change',e=>ui.shuffleAlts=e.target.checked);
  $app.querySelector('#o-order')?.addEventListener('change',e=>ui.shuffleOrder=e.target.checked);
  $app.querySelector('#cnt')?.addEventListener('change',e=>ui.count=+e.target.value);
  $app.querySelectorAll('.chap').forEach(b=>b.addEventListener('click',()=>{
    const c = DATA.find(x=>x.id==b.dataset.c);
    start(`Capítulo ${c.id}`, prep(flat(c)), c.id, titleCase(c.title));
  }));
  $app.querySelector('#go')?.addEventListener('click',()=>{
    const all = DATA.flatMap(flat);
    run={forceOrder:true};
    start('Prova aleatória', prep(shuffle(all).slice(0,ui.count)), null, `${ui.count>=total?total:ui.count} questões sorteadas`);
  });
  $app.querySelector('#theme').addEventListener('click',()=>{
    const r=document.documentElement; const dark = r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme = dark?'light':'dark';
  });
}

function start(label, qs, chapId, sub){
  run = { label, sub, qs, chapId, i:0, hits:0, wrong:[], answered:false };
  question();
}

function question(){
  const q = run.qs[run.i];
  const pct = Math.round(run.i/run.qs.length*100);
  $app.innerHTML='';
  $app.append(el(`<div class="top"><button class="btn ghost" id="quit" type="button" style="min-height:36px;padding:6px 12px">Sair</button>
    <span style="font-variant-numeric:tabular-nums">${run.i+1} / ${run.qs.length} · ${run.hits} certas</span></div>`));
  $app.append(el(`<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`));
  const card = el(`<section class="panel">
    <p class="qtag">${esc(run.label)}${run.chapId?` · pergunta ${q.n}`:''}</p>
    <p class="question">${esc(q.q)}</p>
    <div class="alts">${q.o.map((t,i)=>`<button class="alt" type="button" data-i="${i}"><span class="l">${L[i]}</span><span>${esc(t)}</span></button>`).join('')}</div>
    <p class="fb" id="fb" aria-live="polite"></p>
    <div class="row" id="nx"></div></section>`);
  $app.append(card);
  run.answered=false;
  card.querySelectorAll('.alt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
  $app.querySelector('#quit').addEventListener('click',home);
  window.scrollTo(0,0);
}

function answer(i){
  if(run.answered) return; run.answered=true;
  const q = run.qs[run.i]; const ok = i===q.a;
  if(ok) run.hits++; else run.wrong.push({q,picked:i});
  const btns = $app.querySelectorAll('.alt');
  btns.forEach((b,k)=>{ b.disabled=true; if(k===q.a) b.classList.add('ok'); else if(k===i) b.classList.add('bad'); });
  const fb = $app.querySelector('#fb');
  fb.className='fb '+(ok?'ok':'bad');
  fb.textContent = ok ? 'Correto.' : `Errado. A resposta certa é a letra ${L[q.a]}.`;
  if(!run.chapId && q.chapTitle) fb.textContent += ` (Capítulo ${q.chap}: ${titleCase(q.chapTitle)})`;
  const last = run.i===run.qs.length-1;
  const nx = $app.querySelector('#nx');
  nx.innerHTML = `<button class="btn" id="next" type="button">${last?'Ver resultado':'Próxima'}</button>`;
  const next = nx.querySelector('#next'); next.focus({preventScroll:true});
  next.addEventListener('click',()=>{ if(last) result(); else { run.i++; question(); } });
}

function result(){
  const n=run.qs.length, pct=Math.round(run.hits/n*100);
  if(run.chapId){ const s=store.get(); const k='c'+run.chapId; const prev=s[k]?.best||0; s[k]={best:Math.max(prev,run.hits)}; store.set(s); }
  $app.innerHTML='';
  $app.append(el(`<section class="panel"><p class="eyebrow">${esc(run.label)}</p>
    <p class="score">${run.hits}<span class="muted" style="font-size:28px"> / ${n}</span></p>
    <p>${pct}% de acertos. ${run.wrong.length?`Você errou ${run.wrong.length}.`:'Gabaritou.'}</p>
    <div class="row">
      ${run.wrong.length?'<button class="btn" id="redo" type="button">Refazer só os erros</button>':''}
      <button class="btn ${run.wrong.length?'ghost':''}" id="again" type="button">Refazer tudo</button>
      <button class="btn ghost" id="home" type="button">Início</button></div></section>`));
  if(run.wrong.length){
    $app.append(el('<h2>Para revisar</h2>'));
    const r=el('<div class="review"></div>');
    run.wrong.forEach(({q,picked})=>r.append(el(`<div class="rev">
      <p class="muted" style="font-size:12px">${q.chap?`Capítulo ${q.chap}`:''}${q.n?` · pergunta ${q.n}`:''}</p>
      <p class="q">${esc(q.q)}</p>
      <p class="you">Você marcou: ${L[picked]}) ${esc(q.o[picked])}</p>
      <p class="right">Certa: ${L[q.a]}) ${esc(q.o[q.a])}</p></div>`)));
    $app.append(r);
  }
  const keep={label:run.label,sub:run.sub,chapId:run.chapId,qs:run.qs,wrong:run.wrong};
  $app.querySelector('#home').addEventListener('click',home);
  $app.querySelector('#again').addEventListener('click',()=>{ const fresh = prep(keep.qs.map(q=>({...q,o:q.o,a:q.a}))); start(keep.label,fresh,keep.chapId,keep.sub); });
  $app.querySelector('#redo')?.addEventListener('click',()=>{ start(keep.label+' · erros',prep(keep.wrong.map(w=>w.q)),null,''); run.chapId=keep.chapId&&null; });
  window.scrollTo(0,0);
}
home();
</script>

</body>
</html>
