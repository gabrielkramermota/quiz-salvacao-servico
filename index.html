como organizar a obra jovem sem excesso de mecanismos?", "o": ["Para Tiago White.", "Para Ellen G. White (enviada através do pastor W. C. White).", "Para A. G. Daniells."], "a": 1}, {"n": 4, "q": "Na carta de resposta escrita por W. C. White em 25 de julho de 1901, o que Ellen White declarou sobre a Sociedade do Empenho Cristão?", "o": ["Que deveríamos copiar todos os seus estatutos e regras rígidas.", "Que o espírito, entusiasmo, energia e dedicação ao serviço eram dignos de imitação, mas NÃO os seus planos de organização e mecanismos.", "Que a igreja deveria fechar suas portas para qualquer ideia jovem."], "a": 1}, {"n": 5, "q": "Segundo o conselho enviado pelo pastor W. C. White, como deveriam ser formados os grupos de jovens na igreja?", "o": ["Como sociedades independentes com direção autônoma.", "Como grupos de obreiros sob a liderança e conselho de oficiais e membros experientes da igreja.", "Como clubes sociais de entretenimento noturno."], "a": 1}, {"n": 6, "q": "Que perigo o pastor W. C. White observou ao assistir às reuniões da Liga Epworth em São Francisco?", "o": ["Que eles eram focados demais na Bíblia.", "Que a obra havia se tornado uma viagem de lazer e entretenimento social, perdendo a simplicidade e o foco missionário de Cristo.", "Que não havia jovens presentes nas reuniões."], "a": 1}, {"n": 7, "q": "Qual passagem bíblica é citada no encerramento da carta do pastor W. C. White como a promessa para unir corações de pais e filhos no ministério?", "o": ["Apocalipse 14:6-12", "Malaquias 4:5-6", "Isaías 58:13"], "a": 1}, {"n": 8, "q": "Qual era o único material/literatura que o Departamento da Escola Sabatina conseguiu financiar para os jovens em 1901?", "o": ["Um livro de capa dura sobre história adventista.", "Um pequeno cartão de inscrição para associados (vendido a um centavo).", "Uma revista mensal colorida."], "a": 1}, {"n": 9, "q": "O que trazia impresso o cartão de inscrição dos associados de 1901?", "o": ["O regulamento de uniforme e marcha.", "O Alvo, o Lema e o Voto do ministério jovem, além de diretrizes simples de organização.", "O preço das mensalidades da igreja."], "a": 1}, {"n": 10, "q": "Qual foi o lema original adotado no cartão dos jovens em 1901?", "o": ["\"Servir com alegria\".", "\"O amor de Cristo nos constrange\" (ou me motiva).", "\"Salvar do pecado e guiar no serviço\"."], "a": 1}, {"n": 11, "q": "Qual era o alvo original impresso no cartão dos jovens em 1901?", "o": ["\"Evangelizar a América do Norte em 10 anos\".", "\"A mensagem do advento a todo o mundo nesta geração\".", "\"Construir mil igrejas no mundo\"."], "a": 1}, {"n": 12, "q": "Qual era o conteúdo do Voto original do Missionário Voluntário impresso no cartão de 1901?", "o": ["\"Prometo ser fiel à pátria e à bandeira adventista todos os dias.\"", "\"Porque amo ao Senhor Jesus, e com Ele desejo servir Sua Causa, associo-me à Sociedade dos Jovens para tomar parte ativa em sua obra...\"", "\"Prometo pagar o dízimo e frequentar os cultos de quarta-feira.\""], "a": 1}, {"n": 13, "q": "De acordo com o reverso do cartão de 1901, qual era a condição de membro da Sociedade de Jovens?", "o": ["Ter mais de 21 anos e curso superior.", "Ser um jovem que ama a Jesus e deseja empenhar-se em serviço ativo em Sua causa.", "Pagar uma taxa anual de inscrição."], "a": 1}, {"n": 14, "q": "Como a Sra. L. Flora Plummer conseguiu que as Associações nomeassem líderes para os jovens quando a resposta inicial foi lenta?", "o": ["Ela enviou uma carta avisando que os diretores de Escola Sabatina seriam considerados líderes de jovens até que alguém fosse nomeado.", "Ela demitiu todos os presidentes de Associação.", "Ela cancelou as lições da Escola Sabatina."], "a": 0}, {"n": 15, "q": "Qual foi a primeira série de estudos oficiais para reuniões de jovens publicada no The Youth's Instructor em junho de 1901?", "o": ["Um estudo do livro O Grande Conflito.", "Uma série de estudos com base no livro Caminho a Cristo.", "Um manual de acampamento."], "a": 1}, {"n": 16, "q": "Em 1903, qual livro do Espírito de Profecia começou a ser estudado capítulo por capítulo pelas sociedades de jovens durante quase um ano?", "o": ["Patriarcas e Profetas.", "O Grande Conflito.", "O Desejado de Todas as Nações."], "a": 1}, {"n": 17, "q": "Quantas sociedades de jovens e quantos membros o relatório da Escola Sabatina apresentou na Assembleia da Associação Geral de 1903?", "o": ["10 sociedades e 100 membros.", "186 sociedades e 3.478 membros.", "1.000 sociedades e 50.000 membros."], "a": 1}, {"n": 18, "q": "No relatório de 1905 apresentado à Associação Geral, para quanto havia crescido o número de sociedades de jovens organizadas?", "o": ["200 sociedades.", "Mais de 350 sociedades bem organizadas com 5.000 membros.", "50 sociedades."], "a": 1}, {"n": 19, "q": "Em qual país fora da América do Norte o trabalho com os jovens começou de forma quase simultânea com os EUA?", "o": ["Alemanha.", "Austrália.", "Brasil."], "a": 1}, {"n": 20, "q": "Qual foi o primeiro país/campo estrangeiro a enviar um relatório oficial das atividades dos jovens para a Associação Geral (em 1905/1907)?", "o": ["Inglaterra.", "Jamaica.", "Ilhas Cook."], "a": 1}]}, {"id": 7, "title": "JOVENS ADVENTISTAS", "questions": [{"n": 1, "q": "Qual o significado teológico do lema \"O amor de Cristo me motiva\"?", "o": ["Que o medo do juízo é a única força para fazer o bem.", "Que um relacionamento pessoal de amor com Cristo é a força impelente e inabalável para o serviço abnegado.", "Que as obras humanas são a causa da salvação."], "a": 1}, {"n": 2, "q": "O que o Alvo \"A mensagem do advento a todo o mundo em minha geração\" pressupõe da parte do jovem?", "o": ["Apenas a memorização mecânica de datas proféticas.", "Um conhecimento profundo da mensagem na mente e no coração, refletido em seu estilo de vida.", "A obrigatoriedade de se tornar um pastor ordenado."], "a": 1}, {"n": 3, "q": "Quais são as três partes fundamentais do Alvo dos Missionários Voluntários analisadas no texto?", "o": ["A mensagem do advento (o quê); A todo o mundo (onde); Em minha geração (quando).", "A igreja local (o quê); A comunidade (onde); No futuro (quando).", "A lição (o quê); O sábado (onde); Sempre (quando)."], "a": 0}, {"n": 4, "q": "De acordo com Matilda Erickson, de quais quatro maneiras um jovem Missionário Voluntário pode ajudar a terminar a obra?", "o": ["Estudando, praticando esportes, viajando e trabalhando.", "Vivendo uma vida consagrada, prestando serviço, orando pela obra/obreiros e doando seus recursos.", "Escrevendo livros, cantando, pregando e construindo."], "a": 1}, {"n": 5, "q": "Qual é o conceito de Luther Warren sobre a vida dos jovens em relação ao preparo e ao serviço?", "o": ["A vida deve ser dividida em duas fases: primeiro apenas estudar até os 30 anos, depois servir.", "A vida não deve ser dividida em duas partes; desde o momento em que se entrega a Cristo, o jovem deve começar a trabalhar por outros.", "O jovem só deve servir se for pago pela denominação."], "a": 1}, {"n": 6, "q": "Segundo o voto dos Missionários Voluntários, o que significa \"tomar parte ativa\" nas reuniões da sociedade?", "o": ["Assistir às reuniões em silêncio e ir embora rapidamente.", "Participar fielmente dos programas, reuniões de oração, testemunho e apoio a todos os departamentos da igreja local.", "Assumir a liderança sem prestar contas à comissão da igreja."], "a": 1}, {"n": 7, "q": "Como o texto descreve a relação entre o jovem e a igreja local?", "o": ["A sociedade de jovens deve ser uma igreja paralela e independente.", "A sociedade é parte integrante da igreja; o jovem fiel edifica a igreja como um todo e apoia seus departamentos.", "O jovem deve frequentar a igreja apenas nos cultos J.A. de sábado à tarde."], "a": 1}, {"n": 8, "q": "Em 1903 e 1905, além da América do Norte e Austrália, em quais outros lugares surgiram sociedades de jovens organizadas?", "o": ["Alemanha, Inglaterra, Trinidad, Ilhas Cook e África.", "Japão, China e Rússia.", "França, Espanha e Itália apenas."], "a": 0}, {"n": 9, "q": "O que demonstra que o movimento de jovens no início do século XX era dirigido por Deus e não por mera pressão social?", "o": ["A enorme quantidade de dinheiro investida em propaganda secular.", "O surgimento espontâneo de grupos com a mesma unidade de fé, propósito e espiritualidade em diferentes continentes sem coordenação prévia centralizada.", "A criação de leis obrigatórias pelo governo."], "a": 1}, {"n": 10, "q": "Qual a relação entre a doutrina do Santuário e o Evangelho na motivação do jovem adventista?", "o": ["Nenhuma relação.", "A compreensão da hora do juízo traz urgência e solenidade para a proclamação da salvação e preparação de um povo.", "É apenas um tema para debates teológicos acadêmicos."], "a": 1}, {"n": 11, "q": "Qual o papel do Espírito Santo na vida do jovem segundo a promessa de Atos 2:17-18 citada no capítulo?", "o": ["Capacitá-lo para acumular títulos seculares.", "Derramar dons espirituais para que filhos e filhas profetizem, tenham visões e testemunhem com poder.", "Isentá-lo de qualquer provação ou luta na terra."], "a": 1}, {"n": 12, "q": "Segundo citação de Ellen G. White em Conselhos para Pais e Professores, p. 176, o que acontecerá quando os adultos forem impedidos de pregar a verdade?", "o": ["A obra de pregação será encerrada para sempre.", "O Espírito de Deus virá sobre as crianças e jovens para proclamar a verdade.", "Os anjos descerão e pregarão visivelmente nas televisões."], "a": 1}, {"n": 13, "q": "De acordo com o livro, a expressão \"O amor de Cristo nos constrange\" (II Coríntios 5:14) traz qual sentido para a palavra \"constrange\"?", "o": ["Constranger no sentido de envergonhar o jovem.", "Impulsionar, motivar e dominar o coração com uma força irresistível de amor.", "Ocultar a fé em público."], "a": 1}, {"n": 14, "q": "Qual é o fundamento para que os jovens aceitem a responsabilidade do serviço missionário?", "o": ["O medo de punição pastoral.", "O reconhecimento do amor de Deus demonstrado na cruz do Calvário.", "O desejo de receber medalhas e troféus na igreja."], "a": 1}, {"n": 15, "q": "Qual a importância das reuniões da Sociedade de Jovens para a igreja local no período de 1901-1907?", "o": ["Era o momento de negócios comerciais da igreja.", "Era o centro de treinamento, inspiração espiritual, oração e planejamento de ação missionária.", "Era um espaço para debates políticos seculares."], "a": 1}, {"n": 16, "q": "O que se pretendia ao ensinar a história e as profecias aos jovens desde a infância?", "o": ["Evitar que lessem outros livros.", "Criar raízes profundas de fé para que não fossem levados por ventos de doutrina na vida adulta.", "Fazer com que passassem em exames vestibulares."], "a": 1}, {"n": 17, "q": "O voto do jovem envolvia o compromisso de levar a mensagem em quais dois âmbitos geográficos?", "o": ["Apenas na sua própria rua.", "Tanto na pátria (local) quanto no exterior (mundial).", "Exclusivamente em países estrangeiros."], "a": 1}, {"n": 18, "q": "Qual era a atitude dos pioneiros em relação à juventude que professava a fé mas não demonstrava conversão sincera?", "o": ["Expulsá-los imediatamente da igreja.", "Trabalhar por eles através dos pequenos grupos para levá-los a uma conversão verdadeira a Cristo.", "Ignorá-los totalmente."], "a": 1}, {"n": 19, "q": "A expressão \"Salvação e Serviço\" resume quais dois aspectos da vida cristã?", "o": ["O aspecto passivo (receber a graça) e o aspecto ativo (compartilhar a graça através do amor prático).", "O batismo de adultos e a ordenação de pastores.", "O dízimo e as ofertas."], "a": 0}, {"n": 20, "q": "Como o crescimento do número de sociedades (600% entre 1901 e 1907) foi avaliado pela liderança da igreja?", "o": ["Como um problema administrativo perigoso.", "Como o cumprimento da profecia e uma evidência do poder do Espírito Santo dirigindo a igreja remanescente.", "Como uma coincidência temporária."], "a": 1}]}, {"id": 8, "title": "DEPARTAMENTO SEPARADO", "questions": [{"n": 1, "q": "Em que data e local a Comissão da Associação Geral votou criar oficialmente o Departamento de Jovens como uma entidade separada?", "o": ["10 de julho de 1907 em Mount Vernon, Ohio.", "15 de maio de 1907 em Gland, Suíça.", "20 de maio de 1908 em Battle Creek."], "a": 1}, {"n": 2, "q": "Quem foram nomeados durante o Concílio de Gland para servirem como o primeiro Presidente e a primeira Secretária do novo Departamento de Jovens?", "o": ["Tiago White e Ellen White.", "M. E. Kern (Presidente) e Matilda Erickson (Secretária).", "Luther Warren e L. Flora Plummer."], "a": 1}, {"n": 3, "q": "Quem era o secretário da Associação Geral em 1907 que escreveu na Review and Herald que o voto de Gland foi \"um chamado divino\"?", "o": ["W. A. Spicer.", "I. H. Evans.", "J. N. Andrews."], "a": 0}, {"n": 4, "q": "Quantos delegados se reuniram na histórica Convenção de Mount Vernon, Ohio, em julho de 1907?", "o": ["50 delegados.", "Mais de 200 delegados.", "1.000 delegados."], "a": 1}, {"n": 5, "q": "Qual foi a nota/tom dominante que ressoou em todas as palestras e reuniões durante a Convenção de Mount Vernon?", "o": ["A arrecadação de recursos para colégios.", "A terminação da obra nesta geração para abreviar a vinda de Cristo em justiça.", "A criação de novas regras de vestuário."], "a": 1}, {"n": 6, "q": "De acordo com o relatório de M. E. Kern em 1930, em quais três vertentes os planos de Mount Vernon capacitaram os jovens?", "o": ["Física, mental e financeira.", "Missionária organizada, devocional e educacional.", "Política, social e esportiva."], "a": 1}, {"n": 7, "q": "O Concílio de Gland reconheceu que as exigências do evangelho pesam sobre quem?", "o": ["Apenas sobre os pastores credenciados.", "Sobre todos os membros da igreja, inclusive os jovens.", "Exclusivamente sobre os idosos e anciãos."], "a": 1}, {"n": 8, "q": "Qual foi a importância do apoio do presidente da Associação Geral, A. G. Daniells, para a criação do Departamento de Jovens?", "o": ["Ele forneceu verbas públicas do governo.", "Ele teve a visão, percepção e liderança para apoiar o sonho de uma organização mundial de jovens adventistas.", "Ele escreveu todos os manuais sozinho."], "a": 1}, {"n": 9, "q": "Na abertura da Convenção de Mount Vernon, qual foi a primeira grande necessidade dos jovens destacada por A. G. Daniells?", "o": ["Uma nova sede administrativa.", "Uma transformação total do coração (conversão) e planos simples para o serviço.", "Instrumentos musicais modernos."], "a": 1}, {"n": 10, "q": "Que tipo de pessoas participou da Convenção de Mount Vernon em julho de 1907?", "o": ["Apenas administradores idosos da Associação Geral.", "Administradores, departamentais, obreiros, leigos e os próprios jovens.", "Apenas estudantes de teologia."], "a": 1}, {"n": 11, "q": "Qual foi a atitude dos delegados em Mount Vernon ao elaborarem as resoluções e diretrizes?", "o": ["Buscaram com fervorosa oração a vontade de Deus na Bíblia e no Espírito de Profecia.", "Copiaram os estatutos da Universidade de Harvard.", "Votaram tudo rapidamente sem discutir."], "a": 0}, {"n": 12, "q": "Como o pastor I. H. Evans descreveu o Concílio de Gland dez anos depois (em 1917)?", "o": ["Como um erro administrativo.", "Como o marco inicial da obra organizada em favor dos jovens, que levou a uma era de intensas atividades.", "Como uma reunião sem importância."], "a": 1}, {"n": 13, "q": "De acordo com M. E. Kern, qual era o destino que frequentemente se dava à \"irrequieta energia da juventude\" quando não canalizada para o serviço da igreja?", "o": ["Tornava-se uma fonte de perigo e tentação.", "Transformava-se em riqueza financeira.", "Desaparecia naturalmente."], "a": 0}, {"n": 14, "q": "Algum dos planos fundamentais ideados na Convenção de Mount Vernon em 1907 falhou com o passar dos anos?", "o": ["Sim, todos falharam no ano seguinte.", "Não, nenhum dos planos ideais falhou, provando a orientação divina dos pioneiros.", "Apenas os planos de oração funcionaram."], "a": 1}, {"n": 15, "q": "Qual a razão dada para retirar a obra dos jovens do Departamento da Escola Sabatina em 1907?", "o": ["O crescimento e a extensão da obra dos jovens tornaram impossível para a Escola Sabatina dar a atenção necessária a ambas as áreas.", "Os líderes da Escola Sabatina não gostavam de jovens.", "O departamento da Escola Sabatina foi extinto."], "a": 0}, {"n": 16, "q": "O Departamento de Jovens foi criado para ser um órgão de entretenimento ou um exército de obreiros?", "o": ["Um órgão de entretenimento nas férias.", "Um departamento para a capacitação de um exército de obreiros para o serviço de Deus.", "Um clube de esportes universitários."], "a": 1}, {"n": 17, "q": "O que representou a publicação do relatório oficial da Convenção de Mount Vernon?", "o": ["Um manual de regras jurídicas.", "Uma onda de inspiração e entusiasmo que espalhou o fervor missionário por toda a igreja.", "Um catálogo de vendas de livros."], "a": 1}, {"n": 18, "q": "Quem dirigiu a sessão especial de estudo do Espírito de Profecia que compilou os testemunhos para os delegados em 1907?", "o": ["A. G. Daniells e a comissão organizadora.", "O prefeito de Mount Vernon.", "Representantes de outras denominações."], "a": 0}, {"n": 19, "q": "Qual era o sentimento dos pioneiros em relação à urgência da vinda de Jesus em 1907?", "o": ["Achavam que levaria mais de mil anos.", "Acreditavam solenemente que Jesus voltaria em sua própria geração se fossem fiéis.", "Não se importavam com a segunda vinda."], "a": 1}, {"n": 20, "q": "A criação do Departamento Separado em 1907 foi motivada por razões seculares ou por princípios bíblicos e proféticos?", "o": ["Por razões seculares de mercado.", "Por princípios bíblicos claros e conselhos do Espírito de Profecia.", "Por pressão de partidos políticos da época."], "a": 1}]}, {"id": 9, "title": "FUNÇÕES DO MINISTÉRIO JOVEM", "questions": [{"n": 1, "q": "Quantas funções ou princípios orientadores básicos do ministério jovem foram apresentados por M. E. Kern na Assembleia da Associação Geral de 1909?", "o": ["Três funções.", "Cinco funções.", "Dez funções."], "a": 1}, {"n": 2, "q": "Qual é a PRIMEIRA função do ministério jovem estabelecida em 1907/1909?", "o": ["Ensinar os princípios de mordomia.", "Elevar o nível da vida devocional de cada jovem.", "Organizar torneios esportivos."], "a": 1}, {"n": 3, "q": "Quais programas nasceram para atender à PRIMEIRA função (elevar a vida devocional)?", "o": ["Ano Bíblico, Devoção Matinal, Clássicos do Caráter e Programas de Encontro.", "Clube de Desbravadores e Aventureiros.", "Venda de livros de porta em porta."], "a": 0}, {"n": 4, "q": "Qual é a SEGUNDA função do ministério jovem?", "o": ["Construir acampamentos.", "Melhorar o padrão de conhecimento dos jovens (sobre a história, doutrinas e missão da igreja).", "Organizar viagens de lazer."], "a": 1}, {"n": 5, "q": "Quais estudos e programas foram introduzidos para cumprir a SEGUNDA função (padrão de conhecimento)?", "o": ["Cursos de culinária e corte e costura.", "História Denominacional, Herança e Verdade, e estudos sobre a organização e missão da igreja.", "Aulas de línguas estrangeiras seculares."], "a": 1}, {"n": 6, "q": "Qual é a TERCEIRA função do ministério jovem?", "o": ["Angariar fundos para a Associação.", "Educar e capacitar para o serviço (treinamento de liderança).", "Fazer exames acadêmicos seculares."], "a": 1}, {"n": 7, "q": "Quais estrutura e programas surgiram como resultado da TERCEIRA função (capacitar para o serviço)?", "o": ["Classes Progressivas, Clube de Desbravadores e Cursos de Formação de Líderes (Master Comrade).", "Grupos de teatro profissional.", "Escolas de esportes olímpicos."], "a": 0}, {"n": 8, "q": "Qual é a QUARTA função do ministério jovem?", "o": ["Proporcionar oportunidades de evangelismo e serviço prático.", "Criar sindicatos para jovens.", "Vender materiais promocionais."], "a": 0}, {"n": 9, "q": "Quais projetos e programas exemplificam a QUARTA função (oportunidades de evangelismo)?", "o": ["Evangelismo MV, A Voz da Juventude, Projetos Comunitários e Congressos Missionários.", "Aulas de dança e música secular.", "Festivais de cinema mudo."], "a": 0}, {"n": 10, "q": "Qual é a QUINTA função do ministério jovem?", "o": ["Ensinar os princípios de mordomia cristã em sua definição mais ampla (tempo, talentos, energia e recursos).", "Ensinar sobre investimentos na bolsa de valores.", "Cobrar ingressos para os cultos."], "a": 0}, {"n": 11, "q": "Quais projetos modernos de voluntariado refletem a QUINTA função (mordomia e dedicação de vida)?", "o": ["Serviço Jovem Adventista, Estudantes Missionários e Equipe de Tarefas.", "Estágios em empresas multinacionais seculares.", "Aposentadoria precoce."], "a": 0}, {"n": 12, "q": "O que acontece quando os líderes de jovens se esquecem das 5 funções básicas e focam apenas em \"programas e atividades\"?", "o": ["Os programas tornam-se sinônimos de ministério e, ao falharem em nutrir a fé, levam à decadência espiritual e apostasia.", "A igreja atinge o seu maior crescimento na história.", "Os jovens tornam-se automaticamente santos."], "a": 0}, {"n": 13, "q": "De acordo com a declaração de M. E. Kern em 1911, qual era o papel da \"reunião semanal da sociedade de jovens\" no sábado à tarde?", "o": ["Era a totalidade de todo o ministério jovem.", "Não deveria constituir a totalidade da obra, mas sim uma parte e o centro gerador do ministério.", "Era um evento opcional sem valor espiritual."], "a": 1}, {"n": 14, "q": "No Concílio de Loma Linda em 1915, quais foram as duas resoluções votadas como requisitos primordiais para a obra dos jovens?", "o": ["A aquisição de uniformes e bandeiras.", "A mudança de coração (recebimento do Espírito Santo) e a obra de evangelismo pessoal/pequenos grupos.", "O aumento das taxas de inscrição."], "a": 1}, {"n": 15, "q": "M. E. Kern afirmou em 1915 que os diretores de Missionários Voluntários deveriam ser, além de educadores e organizadores, o quê?", "o": ["Políticos e empresários.", "Evangelistas.", "Juízes e advogados."], "a": 1}, {"n": 16, "q": "Em qual sermão o pastor A. G. Daniells enumerou 9 maneiras de integrar a causa em favor dos jovens (em Pittsburgh, 1912)?", "o": ["\"A Cooperação que Solicitamos para a Obra em Favor dos Jovens\".", "\"O Fim dos Tempos\".", "\"A História de Luther Warren\"."], "a": 0}, {"n": 17, "q": "O que A. G. Daniells destacou como o melhor método para \"ligar a juventude à causa de Deus\"?", "o": ["Dar-lhes presentes e prêmios em dinheiro.", "Fazê-los trabalhar pelos outros (envolvê-los no serviço).", "Isentá-los de qualquer responsabilidade espiritual."], "a": 1}, {"n": 18, "q": "Qual é a diferença entre as \"funções\" e os \"objetivos básicos\" do ministério jovem?", "o": ["Não há diferença nenhuma.", "Os objetivos básicos são Salvação e Serviço; as funções são os 5 caminhos/princípios operacionais para alcançar esses objetivos.", "As funções são seculares e os objetivos são bíblicos."], "a": 1}, {"n": 19, "q": "A observância da Devoção Matinal era considerada o segredo para quê?", "o": ["Para passar em exames escolares.", "Para estabelecer uma comunhão ininterrupta com o céu e obter sucesso na conquista de almas.", "Para ter saúde física perfeita sem necessidade de descanso."], "a": 1}, {"n": 20, "q": "De acordo com o livro, o que o ministério jovem deve ser em sua totalidade dentro da igreja local?", "o": ["Um departamento isolado focado apenas em lazer.", "Uma obra completa de salvação, educação, fortalecimento espiritual e engajamento no serviço missionário.", "Um grupo de discussão teológica sem aplicação prática."], "a": 1}]}, {"id": 10, "title": "MINISTÉRIO JOVEM E OUTROS DEPARTAMENTOS", "questions": [{"n": 1, "q": "Na palestra do pastor G. B. Thompson (Diretor de Escola Sabatina da AG em 1907), qual foi a relação estabelecida entre a Escola Sabatina e o Departamento de Jovens?", "o": ["Eram departamentos rivais que disputavam o orçamento.", "A Escola Sabatina foca no estudo da lição, enquanto o Departamento de Jovens foca no serviço/atividade missionária, trabalhando juntos em harmonia.", "O Departamento de Jovens substituiu totalmente a Escola Sabatina."], "a": 1}, {"n": 2, "q": "Qual objeção alguns membros levantaram contra a criação da Sociedade de Jovens em relação à Sociedade Missionária da igreja?", "o": ["Que a Sociedade de Jovens gastaria papel demais.", "Que criar uma sociedade missionária de jovens duplicaria o trabalho e enfraqueceria a sociedade missionária dos adultos.", "Que os jovens não sabiam falar em público."], "a": 1}, {"n": 3, "q": "Como o estudo de O. J. Graf (\"Por que Devemos Ter Sociedades de Jovens?\") respondeu a essa objeção de duplicidade?", "o": ["Afirmando que os jovens aprendem e trabalham melhor entre seus pares, tornando-se mais eficazes para a salvação e para ajudar a própria igreja dos adultos.", "Concordando que a sociedade de jovens deveria ser fechada.", "Sugerindo que os adultos fossem proibidos de fazer missões."], "a": 0}, {"n": 4, "q": "De acordo com Matilda Erickson, quais são os TRÊS departamentos da igreja que atendem diretamente as crianças e jovens e devem trabalhar em perfeita harmonia?", "o": ["Publicações, Saúde e Comunicação.", "Escola Sabatina, Sociedade Missionária do Lar e Sociedade dos Missionários Voluntários (Jovens).", "Tesouraria, Secretaria e Diaconato."], "a": 1}, {"n": 5, "q": "Qual era o papel das Escolas e Colégios Adventistas na visão do Professor Frederick Griggs em 1907?", "o": ["Locais para obter diplomas para o mercado secular.", "Instituições \"missionárias por natureza\" para formar, treinar e enviar obreiros consagrados para o serviço de Deus no mundo.", "Prédios para reuniões sociais de fim de semana."], "a": 1}, {"n": 6, "q": "Como as Sociedades de Jovens e as Escolas Adventistas se relacionavam mutuamente?", "o": ["As sociedades de jovens nas igrejas funcionavam como \"centros de recrutamento\" de jovens consagrados para estudar nos colégios da igreja.", "As escolas proibiam a existência de sociedades de jovens.", "Os colégios só aceitavam alunos não-adventistas."], "a": 0}, {"n": 7, "q": "O que ocorreu no histórico Concílio de Santa Helena (Califórnia) em junho de 1915 entre os líderes dos Missionários Voluntários e da Educação?", "o": ["Decidiu-se fechar todas as escolas adventistas.", "Elaboraram-se planos de cooperação mútua, integração com adolescentes/juvenis e fortalecimento das sociedades MV nos colégios.", "Os líderes de jovens foram proibidos de entrar nos colégios."], "a": 1}, {"n": 8, "q": "De acordo com o pastor M. E. Kern em 1918, qual era a função principal das sociedades de jovens nos colégios adventistas?", "o": ["Ser o centro das atividades missionárias da instituição e preparar jovens para missões na pátria e no exterior.", "Organizar festas de formatura.", "Gerenciar a cantina da escola."], "a": 0}, {"n": 9, "q": "O que o pastor A. G. Daniells destacou no seu sermão \"Nossa Missão Perante o Mundo\" (1907) sobre a mensagem do terceiro anjo?", "o": ["Que ela deveria ser mantida em segredo na igreja.", "Que ela é a razão de ser do movimento adventista e deve estar entretecida em cada fibra do ser de nossas crianças e jovens.", "Que é uma teoria ultrapassada do século XIX."], "a": 1}, {"n": 10, "q": "Por que os jovens são essenciais para levar a mensagem a terras distantes segundo A. G. Daniells?", "o": ["Porque os idosos não conseguem aprender novos idiomas, viajar para campos difíceis e suportar privações com a mesma energia.", "Porque as passagens de avião para jovens são mais baratas.", "Porque os jovens não têm sentimentos."], "a": 0}, {"n": 11, "q": "Qual é a principal diferença entre o objetivo das Sociedades Missionárias dos adultos e da Sociedade de Jovens segundo O. J. Graf?", "o": ["Os adultos só doavam dinheiro e os jovens só oravam.", "A sociedade dos adultos focava em levar a verdade aos de fora; a de jovens focava PRIMEIRO na salvação e desenvolvimento da própria juventude da igreja, e DEPOIS no serviço.", "Não havia nenhuma diferença."], "a": 1}, {"n": 12, "q": "Segundo o Capítulo 10, o ensino da educação cristã adventista devia combinar o estudo acadêmico com o quê?", "o": ["Com as leis de saúde, fé profunda na Palavra e dedicação à salvação de almas.", "Com a busca por fama e poder político.", "Com o abandono da Bíblia."], "a": 0}, {"n": 13, "q": "A harmonia entre os departamentos de Escola Sabatina, Educação e Jovens entre 1907 e 1915 produziu qual resultado na igreja?", "o": ["Uma era de grande crescimento, unidade, expansão missionária e prosperidade espiritual.", "Falência financeira generalizada.", "Divisão teológica e apostasia em massa."], "a": 0}, {"n": 14, "q": "Como o Professor B. G. Wilkenson definiu a Bíblia em relação à Sociedade de Jovens?", "o": ["Como um livro opcional para a liderança.", "Como o único poder capaz de dar força, manter os objetivos originais e formar guerreiros cristãos de verdade.", "Como uma literatura para ser lida apenas nos cultos de ano novo."], "a": 1}, {"n": 15, "q": "As Escolas Adventistas eram consideradas locais de treinamento para qual tipo de serviço?", "o": ["Exclusivamente para cargos no governo secular.", "Para um serviço mais amplo na causa de Deus em qualquer linha de trabalho que Ele indicasse.", "Para carreiras esportivas profissionais."], "a": 1}, {"n": 16, "q": "O que se esperava dos alunos convertidos nos colégios adventistas quando voltavam para suas igrejas locais?", "o": ["Que se recusassem a conversar com os membros leigos.", "Que fossem líderes ativos, despertando o interesse de outros jovens pelo serviço e pela educação cristã.", "Que abandonassem a fé."], "a": 1}, {"n": 17, "q": "Na declaração de A. G. Daniells em 1907, qual o privilégio dos jovens adventistas em relação aos jovens de outras denominações?", "o": ["Eles possuíam a missão mais definida, sólida e inspiradora do mundo baseada na Palavra de Deus.", "Eles não precisavam trabalhar nem estudar.", "Eles tinham os melhores prédios da época."], "a": 0}, {"n": 18, "q": "Qual departamento era responsável pela publicação do The Youth's Instructor e das lições até 1907?", "o": ["Departamento de Jovens.", "Departamento da Escola Sabatina.", "Departamento de Comunicação."], "a": 1}, {"n": 19, "q": "O Concílio de Educação de 1922 reforçou qual objetivo para o ministério jovem?", "o": ["O aperfeiçoamento dos cursos de liderança e das classes para juvenis e jovens.", "A separação total entre igreja e escola.", "A proibição de atividades ao ar livre."], "a": 0}, {"n": 20, "q": "O que garantiu o sucesso do desenvolvimento do ministério jovem entre 1907 e 1920?", "o": ["O uso de métodos seculares de entretenimento.", "A cooperação irrestrita entre administradores, pastores, educadores e diretores de departamentos focados no mesmo alvo.", "A imposição de multas financeiras aos jovens ausentes."], "a": 1}]}, {"id": 11, "title": "PASSADO E PRESENTE", "questions": [{"n": 1, "q": "Como estava a situação do ministério jovem na Igreja Adventista no final da década de 1920?", "o": ["Totalmente destruído e sem membros.", "Forte, com fundamentos firmes e programas sistemáticos derivados de suas funções bíblicas.", "Igual ao das igrejas seculares, sem identidade."], "a": 1}, {"n": 2, "q": "A partir de qual evento histórico mundial começou a se observar uma mudança significativa na qualidade e funcionamento do ministério jovem adventista?", "o": ["Após a Revolução Francesa.", "Após o fim da Segunda Guerra Mundial (décadas de 1950 e 1960).", "Após o ano 2000."], "a": 1}, {"n": 3, "q": "Na década de 1980, qual constatação tornou-se óbvia para os líderes sobre o ministério jovem em muitos lugares?", "o": ["Que a qualidade do ministério jovem na igreja havia se enfraquecido e perdido o enfoque original.", "Que todos os jovens eram 100% fiéis e ativos.", "Que a Sociedade de Jovens não era mais necessária."], "a": 0}, {"n": 4, "q": "Quais pesquisas profundas realizadas no início dos anos 90 revelaram a real condição dos jovens adventistas no mundo?", "o": ["Pesquisas da Divisão Norte-Americana (1990), Divisão do Sul do Pacífico (1991-92) e da Associação Geral (1990).", "Pesquisas de jornais seculares de Nova Iorque.", "Relatórios de vendas de livros."], "a": 0}, {"n": 5, "q": "Qual dado alarmante sobre a retenção de jovens foi revelado por essas pesquisas globais na década de 1990?", "o": ["A igreja estava mantendo 100% dos seus jovens.", "A igreja estava perdendo quase a metade (50%) de seus jovens para o mundo e para a apostasia.", "Nenhum jovem abandonava a igreja."], "a": 1}, {"n": 6, "q": "De acordo com a pesquisa da Associação Geral em 1992, qual era a porcentagem média MUNDIAL de jovens envolvidos num ministério regular oferecido pela igreja local?", "o": ["90% dos jovens.", "Apenas 21% dos jovens (variando de 8% em uma Divisão a 38% em outra).", "75% dos jovens."], "a": 1}, {"n": 7, "q": "O que a pesquisa revelou sobre os jovens que participavam de um ministério jovem que funcionava de acordo com seus objetivos definidos?", "o": ["Eles apresentavam maior nível de lealdade, fé firme e diminuição de comportamentos de risco.", "Eles abandonavam a igreja mais rápido.", "Não havia diferença alguma em sua conduta."], "a": 0}, {"n": 8, "q": "Qual foi a reação da Comissão da Associação Geral na reunião da primavera de 1990 diante desses dados?", "o": ["Decidiu ignorar o assunto.", "Estabeleceu uma comissão especial para estudar a questão jovem em todas as Divisões.", "Votou o encerramento do Departamento de Jovens."], "a": 1}, {"n": 9, "q": "Quando a comissão especial deveria apresentar seu relatório completo e plano estratégico para o Concílio Anual?", "o": ["Em 1993 (em Bangalore, Índia).", "Em 2010.", "Em 1985."], "a": 0}, {"n": 10, "q": "A pesquisa realizada na Divisão Norte-Americana envolveu o subsídio e a opinião de quantas pessoas aproximadamente?", "o": ["500 pessoas.", "Cerca de 20.000 pessoas (Valuegenesis).", "1 milhão de pessoas."], "a": 1}, {"n": 11, "q": "Qual era o sentimento dos membros e da administração por ocasião do Concílio Anual da Associação Geral em 1992?", "o": ["Indiferença total.", "Reconhecimento da urgência de uma ação reparadora e reestruturação do ministério jovem.", "Satisfação com os resultados alcançados."], "a": 1}, {"n": 12, "q": "Qual a relação entre a ignorância dos princípios históricos e o rumo do ministério jovem atual?", "o": ["Ignorar a história colocou em risco o sucesso e o próprio rumo do ministério em favor dos jovens.", "Ignorar a história fez o ministério melhorar.", "A história não tem nenhuma relação com o presente."], "a": 0}, {"n": 13, "q": "De acordo com o resumo do Capítulo 11, qual destas opções NÃO foi uma conquista do passado da IASD (1879-1920)?", "o": ["Criação de uma forma simples e funcional de organização.", "Substituição do estudo da Bíblia por festivais de entretenimento secular.", "Definição de funções claras (devocional, educacional e missionária)."], "a": 1}, {"n": 14, "q": "A administração da igreja nos primeiros anos criou um departamento exclusivo para os jovens com qual objetivo?", "o": ["Para cobrar impostos dos jovens.", "Para oferecer uma estrutura que permitisse organizar, capacitar, motivar e abastecer as sociedades e seus líderes.", "Para proibir reuniões sociais."], "a": 1}, {"n": 15, "q": "O que os dados da pesquisa de 1990-1993 demonstraram sobre a lealdade dos jovens que permaneciam na igreja?", "o": ["Que muitos deixavam a desejar quanto à lealdade à denominação e ao desenvolvimento da fé quando não havia um ministério jovem ativo.", "Que todos tinham certeza absoluta de suas crenças sem precisar de ajuda.", "Que eles preferiam não ter líderes de jovens."], "a": 0}, {"n": 16, "q": "O que o fim da Segunda Guerra Mundial trouxe para a sociedade e que afetou a igreja?", "o": ["Mudanças sociais, materialismo, urbanização e novos meios de comunicação que impactaram a juventude.", "Uma era de paz absoluta e sem tentações.", "O fim de todas as universidades seculares."], "a": 0}, {"n": 17, "q": "O apelo do Capítulo 11 convida a igreja a aprender com o quê?", "o": ["Com os erros das empresas seculares.", "Com as lições do passado e com os princípios estabelecidos sob orientação divina na história adventista.", "Com os programas de televisão."], "a": 1}, {"n": 18, "q": "As pesquisas entre jovens adventistas na Divisão do Sul do Pacífico e Extremo Oriente envolveram dados de quantas pessoas?", "o": ["Cerca de 50.000 indivíduos.", "100 pessoas.", "Apenas pastores jubilados."], "a": 0}, {"n": 19, "q": "Qual foi a principal revelação do diagnóstico feito entre 1990 e 1993 sobre o ministério jovem nas igrejas locais?", "o": ["Que o ministério jovem estava atingindo 100% dos seus objetivos em todo o mundo.", "Que o ministério não estava atingindo seus objetivos com significativo sucesso e necessitava de profunda reconstrução.", "Que o Clube de Desbravadores deveria ser extinto."], "a": 1}, {"n": 20, "q": "O que significa afirmar que \"a questão do ministério jovem se reveste de grande importância\" para o futuro da igreja?", "o": ["Que sem a salvação e preparo da juventude de hoje, a igreja perde sua continuidade e sua força missionária para o amanhã.", "Que os jovens são apenas doadores de ofertas.", "Que é um assunto meramente decorativo."], "a": 0}]}, {"id": 12, "title": "ORIENTAÇÃO DIVINA OU PRESSÃO SECULAR?", "questions": [{"n": 1, "q": "Como foi revelada a orientação divina no desenvolvimento do ministério jovem adventista na sua origem?", "o": ["Através de um cuidadoso esquadrinhar dos princípios bíblicos e dos conselhos do Espírito de Profecia.", "Através de teorias da psicologia secular ocidental.", "Copiando exatamente os manuais de outras igrejas."], "a": 0}, {"n": 2, "q": "Diferente de outras denominações fundadas por uma única pessoa notável, como se desenvolveu o sistema doutrinário e organizacional da IASD?", "o": ["Através da imposição do governo.", "Através de sincero e fervoroso estudo da Bíblia em conjunto por vários pioneiros, apoiados pelas visões de Ellen G. White.", "Por meio de votações secretas em convenções políticas."], "a": 1}, {"n": 3, "q": "O que o pastor Tiago White escreveu em 1857 sobre a tendência perigosa de algumas pessoas na igreja?", "o": ["Que todos deveriam parar de estudar a Bíblia.", "Que havia dificuldades decorrentes da disposição de eliminar verdades importantes ou de impor ideias prematuras sem maturidade do povo.", "Que o uso de instrumentos musicais era proibido."], "a": 1}, {"n": 4, "q": "Na questão da reforma de saúde e abstenção de carne de porco em 1850, qual foi a orientação dada por Ellen White em 1858 para evitar divisões?", "o": ["Que a igreja deveria se dividir em duas.", "Que Deus estava dirigindo um povo em união (os anjos guiam sem apressar) e que Ele ensinaria à igreja o seu dever no momento certo.", "Que o assunto não tinha importância."], "a": 1}, {"n": 5, "q": "Quando Tiago White escreveu as primeiras lições da Escola Sabatina em 1852, isso foi um ato isolado ou parte do plano de Deus?", "o": ["Foi uma expressão casual de individualismo.", "Foi parte do plano de Deus para que a igreja toda avançasse unida incluindo os jovens no crescimento espiritual.", "Foi um projeto comercial para ganhar dinheiro."], "a": 1}, {"n": 6, "q": "Como os pioneiros adventistas se comportaram em relação às Escolas Dominicais das igrejas populares do século XIX?", "o": ["Copiaram cegamente a sua forma e o seu ciclo de 4 semanas.", "Não copiaram a sua forma nem métodos seculares, mas desenvolveram um modelo próprio focado na instrução bíblica e salvação pessoal.", "Destruíram os prédios das escolas dominicais."], "a": 1}, {"n": 7, "q": "Quando Francis Clark organizou o Empenho Cristão (1881) e Luther Warren organizou o grupo de jovens (1879), qual era a diferença entre a IASD e as outras igrejas nos anos 1880- 1900?", "o": ["A IASD copiou as convenções do Empenho Cristão.", "As outras denominações copiaram o modelo de Clark para evitar perder membros; os adventistas foram motivados pelo zelo profético e alvos de salvação e serviço.", "Os jovens adventistas não estudavam a Bíblia."], "a": 1}, {"n": 8, "q": "Qual foi a advertência dada nos Testemunhos de Ellen White em relação às organizações de jovens de outras denominações (Liga Epworth / Empenho Cristão)?", "o": ["Devemos copiar sua organização, estrutura rígida e programas de entretenimento.", "Devemos copiar o seu zelo, fervor e dedicação ao serviço, mas NÃO o seu conteúdo, organização, estatutos ou tendência ao mero entretenimento social.", "Não devemos pregar para os jovens."], "a": 1}, {"n": 9, "q": "Nas décadas de 1920 e 1930, o que aconteceu quando a IASD começou a perder a motivação missionária original e a olhar para o que as outras denominações faziam?", "o": ["O ministério jovem atingiu o ápice espiritual.", "O vigor das sociedades minguou e começou-se a dar atenção excessiva a debates teóricos, legalismo e às práticas seculares.", "As igrejas locais fecharam."], "a": 1}, {"n": 10, "q": "Nas décadas de 1940 e 1950, qual erro a literatura e o ensino adventistas cometeram em relação às normas da igreja?", "o": ["Ensinaram a doutrina com base estritamente bíblica.", "Formaram uma abordagem teórica e até legalista da salvação, ressaltando proibições sem enfatizar o relacionamento pessoal com Cristo.", "Eliminaram todas as normas da igreja."], "a": 1}, {"n": 11, "q": "O que aconteceu na década de 1950 quando líderes adventistas (especialmente na América do Norte) introduziram a teoria da \"lacuna entre gerações\" e o lema \"jovens com jovens\"?", "o": ["Os adultos foram afastados das reuniões J.A. e a Sociedade de Jovens tradicional desmoronou em muitos lugares.", "As igrejas ficaram cheias de idosos e jovens integrados.", "O número de batismos quadruplicou."], "a": 0}, {"n": 12, "q": "Na década de 1960, ao copiar a tendência das igrejas populares, para onde os grupos de jovens saíram na nave da igreja?", "o": ["Foram para os campos missionários da África.", "Saíram da nave da igreja para se reunir em salões/subsolos, focando em \"companheirismo\", debates sociais e entretenimento.", "Foram estudar nos seminários teológicos."], "a": 1}, {"n": 13, "q": "Qual foi o impacto da \"doutrina dos dons espirituais\" nas décadas de 1960 e 1970 quando mal compreendida no serviço voluntário?", "o": ["Fez com que os jovens só aceitassem servir se o trabalho estivesse na sua lista de dons, reduzindo o senso de dever e comissão geral.", "Fez todos os jovens se tornarem pastores.", "Eliminou a necessidade de oração."], "a": 0}, {"n": 14, "q": "Como o \"serviço voluntário\" de curto prazo passou a ser visto por muitos jovens sob a influência da mentalidade secular (anos 70/80 e Força da Paz)?", "o": ["Como um estilo de vida permanente de compromisso missionário.", "Como um evento único na vida, um contrato de curto prazo para melhorar o curriculum vitae ou viver uma aventura.", "Como uma punição da igreja."], "a": 1}, {"n": 15, "q": "Na década de 1980, quando os programas das Associações promoveram eventos regionais em vez de sociedades locais, o que foi abandonado nas reuniões J.A.?", "o": ["A Bíblia e o hinário.", "O compromisso de membro, o lema, o voto, a Devoção Matinal, o Ano Bíblico e a capacitação para o serviço, substituídos por discussões sociais.", "A iluminação e os bancos da igreja."], "a": 1}, {"n": 16, "q": "Ao tentar descobrir as \"necessidades dos jovens\" através de métodos seculares, de qual culpa muitos líderes se tornaram culpados?", "o": ["De atender em excesso às necessidades espirituais.", "De não investigar quais eram as necessidades de DEUS com respeito aos jovens e focar apenas no entretenimento físico e social.", "De gastar dinheiro demais com Bíblias."], "a": 1}, {"n": 17, "q": "O que Malcolm Allen afirma sobre a existência de sociedades de jovens fiéis em algumas partes do mundo?", "o": ["Que elas foram destruídas em 100% do planeta.", "Que onde se conservaram as organizações de jovens na igreja local, o interesse por coisas espirituais, a lealdade e o espírito de serviço permaneceram elevados.", "Que elas existem apenas nos livros de história."], "a": 1}, {"n": 18, "q": "Qual é a crítica feita no Capítulo 12 ao uso do entretenimento e do lazer como atrativo principal para os jovens na igreja?", "o": ["Que o entretenimento converte mais almas do que a Bíblia.", "Que planejar entretenimento e lazer mata a espiritualidade da juventude e não satisfaz a busca por Deus.", "Que o lazer é proibido em qualquer dia da semana."], "a": 1}, {"n": 19, "q": "De acordo com o livro, qual a diferença primordial entre o modelo divino e a pressão secular no ministério jovem?", "o": ["O modelo divino baseia-se na salvação, conversão e serviço de valor eterno; a pressão secular foca em satisfazer desejos temporários e entretenimento.", "O modelo divino usa uniformes e a pressão secular não.", "Nenhuma diferença."], "a": 0}, {"n": 20, "q": "O Capítulo 12 conclui afirmando que necessitamos desesperadamente de quê?", "o": ["De mais jogos eletrônicos nas reuniões de sábado.", "De uma mudança de atitude, mais recursos e liderança qualificada para conduzir a igreja no método de Deus.", "De fechar o departamento de jovens de uma vez por todas."], "a": 1}]}, {"id": 13, "title": "TENDÊNCIAS INQUIETANTES", "questions": [{"n": 1, "q": "Em que ano e com qual nome foram introduzidas as providências especiais para os juvenis dentro do ministério jovem adventista?", "o": ["1907, Sociedade Jovem.", "1909, Sociedade dos Missionários Voluntários Juvenis.", "1950, Clube de Desbravadores."], "a": 1}, {"n": 2, "q": "Em qual ano foram criadas as \"Classes Progressivas\" para juvenis (posteriormente chamadas de Classes MV / Desbravadores)?", "o": ["1901", "1922", "1985"], "a": 1}, {"n": 3, "q": "Em que ano a igreja oficializou a atividade dos acampamentos para juvenis e jovens?", "o": ["1926", "1950", "1907"], "a": 0}, {"n": 4, "q": "Em 1950, o Clube de Desbravadores foi oficialmente adotado pela Associação Geral. Qual era a contagem aproximada de Desbravadores no mundo citada no capítulo?", "o": ["10.000 Desbravadores.", "Cerca de 2 milhões de Desbravadores.", "500 Desbravadores."], "a": 1}, {"n": 5, "q": "Qual é o perigo apontado por Malcolm Allen em relação ao programa dos Desbravadores quando se perde de vista a sua base bíblica?", "o": ["Focar excessivamente nas atividades físicas e no mecanismo de funcionamento, deixando esquecida a ênfase nas verdadeiras funções espirituais.", "Fazer acampamentos demais no inverno.", "Usar lenço e fivela."], "a": 0}, {"n": 6, "q": "Nas décadas de 1960 e 1970, qual aspecto recebeu importância exagerada nos manuais e publicações dos Desbravadores em detrimento da filosofia espiritual?", "o": ["O estudo das profecias de Apocalipse.", "Aspectos externos como uniforme, insígnias, distintivos, ordem unida e marchas.", "A culinária vegetariana."], "a": 1}, {"n": 7, "q": "Qual erro de enfoque ocorreu ao comparar a Sociedade de Jovens com o Clube de Desbravadores?", "o": ["Achar que o Clube de Desbravadores era o ensino espiritual e a Sociedade de Jovens a atividade física.", "Achar que a Sociedade era o ensino espiritual e o Clube uma atividade puramente física/secular, dissipando a espiritualidade das crianças.", "Considerar ambos como clubes de futebol."], "a": 1}, {"n": 8, "q": "Por quem e em que ano e local foi fundado o movimento do Escotismo (Scouting)?", "o": ["Luther Warren em 1879 nos Estados Unidos.", "Robert Baden-Powell em agosto de 1907 na ilha de Brownsea, Inglaterra.", "Francis Clark em 1881 em Boston."], "a": 1}, {"n": 9, "q": "Qual foi o primeiro livro publicado por Baden-Powell em janeiro de 1908 que deu origem ao movimento mundial do escotismo?", "o": ["Scouting for Boys (Escotismo para Rapazes).", "A Ciência do Bom Viver.", "Manual do Desbravador."], "a": 0}, {"n": 10, "q": "Quais são algumas das semelhanças externas entre o Escotismo e o Clube de Desbravadores?", "o": ["O uso de uniforme, estrutura organizacional, vida ao ar livre, especialidades e nós.", "A guarda do sábado e o estudo do espírito de profecia.", "A pregação de sermões evangelísticos nas praças."], "a": 0}, {"n": 11, "q": "Qual a DIFERENÇA fundamental entre a motivação do Escotismo e a filosofia do Clube de Desbravadores Adventista?", "o": ["O Escotismo ensina a sobreviver neste planeta; a motivação do Desbravador é possibilitar que os juvenis cheguem ao mundo por vir e estejam em pé diante do trono de Deus.", "O Escotismo usa barracas e os Desbravadores não.", "Não há diferença alguma."], "a": 0}, {"n": 12, "q": "O que Malcolm Allen quis dizer com a metáfora de \"comer a caixa e deixar o alimento\"?", "o": ["Que os líderes comem as caixas de papelão nos acampamentos.", "Que os líderes se concentram na caixa (uniforme, insígnias, estruturas, regras) e deixam de lado o verdadeiro alimento espiritual (a Palavra de Deus).", "Que o cereal matinal deve ser consumido com caixa e tudo."], "a": 1}, {"n": 13, "q": "De acordo com o capítulo, o programa dos Desbravadores foi influenciado pelo Escotismo no seu início?", "o": ["Não, não houve nenhuma influência externa.", "Sim, fomos dirigidos por Deus para adotar métodos úteis de treinamento ao ar livre, mas integrados à filosofia de salvação da igreja.", "O Escotismo foi criado por pastores adventistas."], "a": 1}, {"n": 14, "q": "A quem pertencia a responsabilidade de conduzir a Sociedade de Juvenis na maioria dos países fora da América do Norte antes dos Desbravadores?", "o": ["À igreja local como parte integrante da sociedade de jovens.", "Às autoridades policiais da cidade.", "Às escolas públicas."], "a": 0}, {"n": 15, "q": "Qual o risco de transformar o Clube de Desbravadores apenas numa organização comunitária secular semelhante aos Escoteiros?", "o": ["Perder a sua utilidade como instrumento de salvação, evangelismo e conservação dos juvenis na igreja.", "Aumentar o número de membros baptizados.", "Receber verbas do governo."], "a": 0}, {"n": 16, "q": "As tendências seculares no Clube de Desbravadores, se deixadas sem correção, podem provocar o quê?", "o": ["O fortalecimento da fé dos juvenis.", "O desgaste na qualidade do ministério e até a destruição do verdadeiro ministério dos Desbravadores.", "A conversão automática dos pais."], "a": 1}, {"n": 17, "q": "O que os manuais de Desbravadores das décadas de 60 e 70 falharam em estabelecer com clareza?", "o": ["O preço dos uniformes.", "O elo entre a Sociedade de Jovens e o Clube de Desbravadores como sendo sinônimos em alvos e funções espirituais.", "A lista de nós e amarras."], "a": 1}, {"n": 18, "q": "O estudo das especialidades e a vida ao ar livre no Clube de Desbravadores devem servir para quê?", "o": ["Apenas para passar o tempo nos fins de semana.", "Para atrair e desenvolver o caráter do juvenil, conectando-o com o Criador através da natureza.", "Para competir com outros clubes em torneios violentos."], "a": 1}, {"n": 19, "q": "O livro defende o retorno ao formato histórico estático da Sociedade MV do passado?", "o": ["Sim, voltar a fazer exatamente o que se fazia em 1907.", "Não, não podemos repetir o passado, mas sim praticar a mesma filosofia, alvos e funções bíblicas adaptados ao mundo atual.", "Defende o fim de toda a organização."], "a": 1}, {"n": 20, "q": "A famosa citação de Ellen G. White (Testemunhos Seletos, vol. 3, p. 443) lembrada no final do capítulo afirma que \"nada temos a temer quanto ao futuro, a menos que...\":", "o": ["\"...não tenhamos dinheiro suficiente.\"", "\"...nos esquecamos da maneira como o Senhor nos tem guiado e dos Seus ensinos no passado.\"", "\"...os jovens parem de marchar.\""], "a": 1}]}, {"id": 14, "title": "REESTRUTURAÇÃO E REEDIFICAÇÃO", "questions": [{"n": 1, "q": "Em qual evento e ano o presidente da Associação Geral proferiu o sermão de abertura intitulado \"O Estado da Igreja\", dando prioridade total à juventude?", "o": ["Concílio Anual da Associação Geral de 1992.", "Assembléia de Indianapolis em 1990.", "Concílio Anual de 1985."], "a": 0}, {"n": 2, "q": "Qual porcentagem dos crentes adventistas em algumas Divisões do mundo foi citada pelo presidente da AG como sendo pessoas com menos de 30 anos de idade?", "o": ["10 a 20%.", "60 a 70% dos membros.", "Menos de 5%."], "a": 1}, {"n": 3, "q": "Quantos votos sob o título \"Recomendações para reestruturar e reedificar o ministério jovem na Igreja Adventista do Sétimo Dia\" foram tomados no Concílio Anual de 1992?", "o": ["Apenas 1 voto.", "Seis votos principais.", "Vinte votos."], "a": 1}, {"n": 4, "q": "Qual é o PRIMEIRO voto do Concílio Anual de 1992 destacado no capítulo?", "o": ["Aceitação dos jovens como membros regulares e participantes ativos na igreja (não de segunda classe).", "Obrigatoriedade do uso de uniforme em todos os cultos.", "Aumento das ofertas de jovens."], "a": 0}, {"n": 5, "q": "Qual é o SEGUNDO voto do Concílio Anual de 1992?", "o": ["Proibição de jovens na liderança.", "Indicação de especialistas em juventude em todos os níveis da organização da igreja.", "Venda de prédios de acampamentos."], "a": 1}, {"n": 6, "q": "Qual é o TERCEIRO voto do Concílio Anual de 1992?", "o": ["Estabelecimento de um ministério jovem organizado em todas as igrejas locais.", "Transferência das reuniões para a segunda-feira.", "Fim da Escola Sabatina de jovens."], "a": 0}, {"n": 7, "q": "O QUARTO voto estabelece uma \"Abordagem Quadrupla\" para o ministério jovem. Quais são os QUATRO temas ou módulos dessa abordagem?", "o": ["Esporte, Música, Teatro e Lazer.", "Reavivamento, Resgate, Evangelização e Capacitação.", "Estudo, Finanças, Política e Saúde."], "a": 1}, {"n": 8, "q": "Qual é o QUINTO voto do Concílio Anual de 1992?", "o": ["Autorização para a elaboração de um plano estratégico destinado a reestruturar e reedificar o ministério jovem.", "Fechamento das publicações para jovens.", "Criação de novos cargos remunerados no governo secular."], "a": 0}, {"n": 9, "q": "O que estabelece o SEXTO voto do Concílio Anual de 1992?", "o": ["O fim das comissões da igreja.", "O estabelecimento de um \"Gabinete Jovem\" em todos os níveis da organização (da igreja local à Associação Geral) para ouvir os jovens.", "A criação de escolas isoladas."], "a": 1}, {"n": 10, "q": "No módulo REAVIVAMENTO (da abordagem quadrupla), qual o seu foco principal?", "o": ["Promover festas de confraternização.", "A renovação da vida espiritual, melhoria da vida devocional e fortalecimento do relacionamento do jovem com Deus.", "Reformar a pintura dos prédios da igreja."], "a": 1}, {"n": 11, "q": "No módulo RESGATE, qual é o seu objetivo básico?", "o": ["Vender livros nas ruas.", "Reconquistar, recuperar e reformatar a atenção para a apostasia e reconquistar os jovens que se afastaram da igreja.", "Fazer resgates de emergência médica nas estradas."], "a": 1}, {"n": 12, "q": "O módulo EVANGELIZAÇÃO enfatiza o quê no ministério jovem?", "o": ["Utilizar os talentos e o potencial da juventude para cumprir a missão da igreja, instruindo e capacitando os jovens para conduzir outros a Cristo.", "Fazer campanhas políticas na comunidade.", "Arrecadar verbas para a tesouraria."], "a": 0}, {"n": 13, "q": "Qual é a definição dada ao módulo CAPACITAÇÃO?", "o": ["Ensinar habilidades manuais de marcenaria.", "Proporcionar um contínuo crescimento espiritual, educar, treinar a liderança e servir como preventivo contra a apostasia.", "Ensinar os jovens a dirigir veículos."], "a": 1}, {"n": 14, "q": "De acordo com citação de Ellen G. White (Review and Herald, 25 de fevereiro de 1902), o que significa REAVIVAMENTO?", "o": ["Uma mudança de roupas e de horários.", "Uma renovação da vida espiritual, um despertar das faculdades da mente e do coração, e uma ressurreição da morte espiritual.", "A criação de novos regulamentos administrativos."], "a": 1}, {"n": 15, "q": "Segundo a mesma citação de Ellen G. White, o que significa REFORMA?", "o": ["Uma reorganização, uma mudança de ideias, teorias, hábitos e práticas.", "A compra de novos móveis para o templo.", "A alteração dos hinos tradicionais."], "a": 0}, {"n": 16, "q": "O que o \"Gabinete Jovem\" deve fazer na igreja local e nas Associações?", "o": ["Funcionar como uma comissão permanente para ouvir os jovens, entender suas preocupações e fazer recomendações às comissões administrativas.", "Cobrar mensalidades dos jovens.", "Organizar a escala de limpeza do templo."], "a": 0}, {"n": 17, "q": "Quem faz parte do \"Gabinete Jovem\" na igreja local segundo o plano de 1992?", "o": ["Apenas o tesoureiro e o primeiro diácono.", "O pastor, o diretor de jovens e membros da comissão de jovens/liderança da igreja local.", "Pessoas que não pertencem à igreja."], "a": 1}, {"n": 18, "q": "Qual foi a reação dos diretores de jovens da Associação Geral diante dos votos tomados em 1992?", "o": ["Ficaram entusiasmados com as possibilidades de reconstrução do ministério jovem em nível mundial.", "Pediram demissão de seus cargos.", "Rejeitaram todas as propostas."], "a": 0}, {"n": 19, "q": "A inclusão dos jovens na vida e liderança da igreja deve ser feita de que maneira?", "o": ["Como uma mera aparência opcional para foto.", "De forma obrigatória, real e significativa, aceitando-os como membros regulares participantes.", "Apenas se eles pagarem taxas extras."], "a": 1}, {"n": 20, "q": "A abordagem quadrupla (Reavivamento, Resgate, Evangelização e Capacitação) deve servir como o quê para as atividades da igreja?", "o": ["Como um filtro ou teste para todas as atividades e programas do ministério jovem.", "Como um livro de poemas.", "Como um regulamento exclusivo para acampamentos."], "a": 0}]}, {"id": 15, "title": "COMISSÃO PARA TRATAR DOS JOVENS", "questions": [{"n": 1, "q": "Onde e quando se reuniu a liderança de jovens da Associação Geral e das Divisões para analisar os dados das pesquisas e preparar o relatório estratégico?", "o": ["No Colégio Newbold, Inglaterra (8 a 16 de julho de 1993).", "Em Mount Vernon, Ohio (1990).", "Em Brasília, Brasil (1995)."], "a": 0}, {"n": 2, "q": "Qual foi a dupla tarefa recebida por essa comissão reunida em Newbold em 1993?", "o": ["Fechar o departamento e criar um novo fundo financeiro.", "Analisar as conclusões/pesquisas das subcomissões mundiais e começar o preparo de um plano estratégico/tático para remodelar o ministério jovem.", "Escrever um novo livro de cantos."], "a": 1}, {"n": 3, "q": "Onde foi apresentado e aceito o relatório final dessa comissão durante o Concílio Anual da Associação Geral em 1993?", "o": ["Em Bangalore, Índia.", "Em São Paulo, Brasil.", "Em Washington D.C., EUA."], "a": 0}, {"n": 4, "q": "Quantos itens prioritários foram revelados pelos estudos das Divisões e apresentados no relatório da comissão em 1993?", "o": ["Apenas 2 itens.", "Dez questões prioritárias.", "Cinquenta itens."], "a": 1}, {"n": 5, "q": "Qual foi uma das descobertas sobre o impacto da cultura, etnia e ambiente no ministério jovem mundial?", "o": ["Que a cultura determina doutrinas diferentes para cada país.", "Que a cultura desempenha um papel mínimo quanto às grandes questões, pois as necessidades básicas espirituais dos jovens são comuns em todo o mundo.", "Que os jovens de países ricos não têm tentações."], "a": 1}, {"n": 6, "q": "O que as pesquisas chamaram de \"indicadores de risco\" na conduta dos jovens adventistas?", "o": ["Comportamentos que indicavam se o jovem estava se desviando o suficiente para causar preocupação e apostasia (ex: drogas, álcool, imoralidade).", "O uso de relógios digitais.", "A prática de esportes náuticos."], "a": 0}, {"n": 7, "q": "O que a pesquisa revelou sobre o conhecimento doutrinário dos jovens que praticavam comportamentos de risco?", "o": ["Que eles não conheciam nenhuma doutrina.", "Que eles conheciam e estavam convencidos da maioria das doutrinas, mas suas ações e práticas estavam dissociadas da crença (falta de conversão pessoal).", "Que eles foram expulsos das escolas adventistas."], "a": 1}, {"n": 8, "q": "Como o envolvimento em \"comportamentos de risco\" pode ser reduzido na vida dos jovens segundo o relatório?", "o": ["Aumentando as punições públicas.", "Através de uma fé sólida, amadurecida, baseada na Bíblia, com orientação para a salvação pela graça e vida devocional ativa.", "Proibindo os jovens de usarem a internet."], "a": 1}, {"n": 9, "q": "Qual o papel das instituições (Lar, Congregação e Escola) na proteção dos jovens contra comportamentos de risco?", "o": ["Nenhum papel relevante.", "Alunos que estudavam em nossas escolas, participavam dos Desbravadores ou da Sociedade J.A. apresentavam maior lealdade e menor índice de apostasia.", "As instituições devem substituir os pais totalmente."], "a": 1}, {"n": 10, "q": "O que o estudo revelou sobre a relação dos jovens com as \"doutrinas distintivas\" do adventismo (ex: Ellen White, Juízo Investigativo, Povo Remanescente)?", "o": ["Que todos os jovens aceitavam 100% dessas doutrinas sem dúvidas.", "Que muitos jovens questionavam a posição da igreja nessas doutrinas específicas, correndo o risco de não se apegarem aos ensinos exclusivos do adventismo.", "Que essas doutrinas foram excluídas da igreja."], "a": 1}, {"n": 11, "q": "Qual a porcentagem de jovens adventistas no mundo que a igreja parecia estar perdendo por não oferecer uma programação atenta e envolvente?", "o": ["Quase um terço (1/3) de seus jovens.", "Menos de 1%.", "90%."], "a": 0}, {"n": 12, "q": "Como os jovens adventistas se sentiam frequentemente em relação à vida congregacional nas igrejas locais?", "o": ["Sentiam-se totalmente valorizados e no comando.", "Sentiam-se \"deixados de fora\", usados apenas para trabalhos servis ou tarefas insignificantes, raramente convidados a liderar projetos importantes.", "Sentiam-se obrigados a pregar todos os sábados."], "a": 1}, {"n": 13, "q": "Qual era o desejo demonstrado pelos jovens em relação à missão da igreja segundo o relatório de 1993?", "o": ["Queriam se afastar de qualquer trabalho missionário.", "Queriam participar ativamente da obra, vendo a missão da igreja como a sua própria missão.", "Queriam transformar a igreja num clube de festas seculares."], "a": 1}, {"n": 14, "q": "Quais questões sociais do século XXI foram identificadas como fatores que afetam o ministério jovem e promovem a apostasia tanto quanto o materialismo?", "o": ["Desemprego, problemas de moradia, pobreza, AIDS, sexualidade e falta de instalações para recreação adequada.", "O preço dos computadores.", "A velocidade dos transportes."], "a": 0}, {"n": 15, "q": "Qual a consequência da frequente \"rotatividade do pessoal\" na liderança de jovens das Associações e igrejas?", "o": ["Aumento da qualidade e estabilidade dos projetos.", "Queda na qualidade do ministério jovem devido à falta de continuidade e inexperiência dos novos líderes.", "Nenhuma consequência."], "a": 1}, {"n": 16, "q": "O que a liderança da igreja precisa oferecer aos líderes de jovens para melhorar a qualidade do ministério?", "o": ["Prêmios em dinheiro.", "Instrução, treinamento adequado, reciclagem e capacitação embasada na filosofia adventista.", "Licença permanente sem trabalho."], "a": 1}, {"n": 17, "q": "A igreja de hoje precisa ensinar aos jovens que a religião é basicamente uma questão de quê?", "o": ["Um código moral frio com regras jurídicas.", "Um relacionamento pessoal com Deus e com o próximo, em vez de apenas um sistema rígido de regras.", "Uma tradição familiar cultural."], "a": 1}, {"n": 18, "q": "As pesquisas indicaram que manter elevadas normas no lar exercerá influência protetora sobre os jovens em qual condição?", "o": ["Em todos os casos, mesmo com violência.", "Somente nos casos em que essas normas sejam impostas com amor por pessoas que amem os jovens de verdade.", "Apenas se o lar for rico."], "a": 1}, {"n": 19, "q": "O que a Comissão de 1993 em Newbold elaborou para definir de forma clara e unânime o propósito do ministério jovem no mundo?", "o": ["Um novo livro de receitas.", "A Declaração de Missão do Ministério Jovem Adventista.", "Um contrato de trabalho assinado."], "a": 1}, {"n": 20, "q": "A estrutura do Departamento de Jovens precisa ser reavaliada porque o mundo e os jovens mudaram, mas quais elementos NUNCA podem mudar?", "o": ["O modelo de bancos da igreja.", "Nossos alvos bíblicos, as funções do ministério jovem e os princípios do evangelho.", "Os estilos de roupa do século XIX."], "a": 1}]}, {"id": 16, "title": "PRESENTE E FUTURO", "questions": [{"n": 1, "q": "Qual era o número aproximado de jovens adventistas no mundo até 30 anos de idade no final de 2003 citados no capítulo?", "o": ["100.000 jovens.", "Cerca de 8,5 milhões de jovens (sendo 2 milhões de Desbravadores e 6,5 milhões de jovens de 16 a 30 anos).", "50 milhões de jovens."], "a": 1}, {"n": 2, "q": "Nos projetos anuais do Mission Global em regiões não alcançadas, qual porcentagem dos voluntários envolvidos era composta por jovens?", "o": ["10%.", "Cerca de 75% de envolvimento jovem.", "Apenas 2%."], "a": 1}, {"n": 3, "q": "No Ano do Evangelismo Jovem (1993), quantos projetos evangelísticos a juventude realizou e quantos batismos foram alcançados?", "o": ["1.000 projetos e 5.000 batismos.", "100.000 projetos evangelísticos alcançando o alvo de 400.000 batismos.", "Ninguém foi baptizado."], "a": 1}, {"n": 4, "q": "O que o termo \"envolvimento\" significa para os jovens adventistas atuais segundo o Capítulo 16?", "o": ["Apenas sentar no banco e ouvir o culto.", "Entrega total a uma causa pela qual vale a pena viver e morrer, assumindo cargos, pregando, ensinando e servindo voluntariamente.", "Pagar as ofertas e ir embora."], "a": 1}, {"n": 5, "q": "Qual a consequência se a igreja ignorar os votos do Concílio de 1992 e as conclusões das comissões estratégicas?", "o": ["A igreja economizará tempo.", "Resultará no desperdício de nossa iniciativa, subestimando a importância da juventude e aumentando a perda de jovens.", "Os jovens organizarão sua própria denominação."], "a": 1}, {"n": 6, "q": "De acordo com o texto, de quem é a responsabilidade de reedificar o ministério jovem na igreja?", "o": ["Apenas do diretor de jovens da Associação Geral.", "De todos os participantes, administradores, pastores, líderes e dos próprios jovens como uma necessidade real.", "Das agências de notícias seculares."], "a": 1}, {"n": 7, "q": "Por que não podemos nos dar ao luxo de viver do passado no ministério jovem?", "o": ["Porque o passado foi um fracasso total.", "Porque a vida de nossos jovens está em jogo, as prioridades e circunstâncias mudaram e o tempo do fim é agora.", "Porque os livros antigos foram queimados."], "a": 1}, {"n": 8, "q": "O que o autor responde à pergunta: \"Se Cristo vier enquanto estou ocupando este cargo, que diferença terá causado o meu ministério junto aos jovens?\"", "o": ["Que a posição administrativa é o mais importante.", "Que o único motivo da existência da igreja e do ministério é salvar pessoas para o reino de Deus.", "Que o importante é acumular relatórios de papel."], "a": 1}, {"n": 9, "q": "Na afirmação \"Não estamos aqui para começar a obra, estamos aqui para...\", qual a palavra que completa a frase?", "o": ["\"...aproveitar a vida.\"", "\"...concluí-la\" (com um profundo senso de urgência).", "\"...esperar passivamente.\""], "a": 1}, {"n": 10, "q": "O que acontecerá quando a \"chuva serôdia\" for derramada sobre a igreja nos últimos dias?", "o": ["As pessoas se isolarão em suas casas.", "As pessoas e seus recursos se unirão para a terminação da obra, e os jovens ocuparão o seu lugar de destaque.", "A igreja deixará de existir."], "a": 1}, {"n": 11, "q": "Qual deve ser o foco da nossa ênfase no ministério jovem segundo o ponto 1 dos lembretes do Capítulo 16?", "o": ["Uma ênfase puramente social e física.", "Uma ênfase espiritual na salvação dos jovens.", "Uma ênfase no aumento de taxas financeiras."], "a": 1}, {"n": 12, "q": "A nossa motivação para mudar o ministério jovem deve ser um desejo superficial ou o quê?", "o": ["Uma moda temporária.", "Um zelo ardente e uma motivação profunda e genuína pela salvação de nossos jovens.", "Uma imposição de leis governamentais."], "a": 1}, {"n": 13, "q": "Em relação à mecânica da administração do programa, onde deve estar concentrada a atenção dos líderes?", "o": ["Na mecânica dos uniformes e relatórios.", "Nos legítimos objetivos e funções espirituais do ministério jovem.", "Na compra de equipamentos de som caros."], "a": 1}, {"n": 14, "q": "Se a conservação dos jovens nascidos na igreja aumentar de 50% para 80% através de um ministério atrativo local, qual o impacto disso?", "o": ["Nenhum impacto numérico.", "Significaria quase dois terços de um milhão de jovens a mais salvos da apostasia no mundo.", "A igreja ficaria sem espaço para estacionamento."], "a": 1}, {"n": 15, "q": "Qual a porcentagem de retenção de jovens em igrejas locais onde NÃO há um programa ou ministério jovem ativo?", "o": ["Retém-se menos de 20% dos novos jovens.", "Retém-se 99% dos jovens.", "Retém-se 50%."], "a": 0}, {"n": 16, "q": "O funcionamento do ministério jovem em todos os níveis da organização deve combinar o quê?", "o": ["Ideias seculares com recursos públicos.", "A reestruturação e reedificação da liderança com a participação ativa e escuta da voz dos jovens.", "A exclusão de juvenis dos acampamentos."], "a": 1}, {"n": 17, "q": "Malcolm Allen afirma que a filosofia do ministério jovem deve se refletir em quais áreas da igreja?", "o": ["Apenas nas reuniões de sábado à tarde.", "Em nossas atitudes, programas, atividades, currículos escolares, recursos, orçamentos, liderança e capacitação.", "Apenas nos manuais da Associação Geral."], "a": 1}, {"n": 18, "q": "Quanto tempo a igreja tem para tomar novas iniciativas e adotar abordagens que salvem os jovens?", "o": ["Temos centenas de anos pela frente.", "\"Temos tempo para fazer isso apenas uma vez; façamo-lo, portanto, da maneira correta logo de início.\"", "O tempo já acabou e não há nada a fazer."], "a": 1}, {"n": 19, "q": "Qual o perfil de líderes que o século XXI exige para o ministério jovem?", "o": ["Líderes autoritários que não ouvem ninguém.", "Líderes práticos, mas também visionários, equipados para guiar a juventude nas complexidades da sociedade moderna conservando-os em Cristo.", "Líderes que não leiam a Bíblia."], "a": 1}, {"n": 20, "q": "Qual a garantia dada aos líderes que se empenham fielmente na salvação da juventude?", "o": ["Que receberão grandes salários na terra.", "A segurança de que o Senhor está no comando e de que a juventude estará segura em Cristo para a eternidade.", "Que nunca terão problemas ou desafios."], "a": 1}]}, {"id": 17, "title": "NOSSA MISSÃO", "questions": [{"n": 1, "q": "Em qual mês e ano os líderes do ministério jovem da Associação Geral e das Divisões se reuniram no Colégio Newbold para redigir a Declaração de Missão?", "o": ["Julho de 1993.", "Dezembro de 2000.", "Maio de 1985."], "a": 0}, {"n": 2, "q": "Quantas páginas de relatórios, pesquisas e estudos foram analisadas pelos líderes nessa comissão em Newbold?", "o": ["10 páginas.", "Quase mil páginas de relatórios e pesquisas mundiais.", "50 páginas."], "a": 1}, {"n": 3, "q": "Qual o OBJETIVO PRIMORDIAL do Ministério Jovem Adventista estabelecido no primeiro parágrafo da Declaração de Missão?", "o": ["A organização de eventos esportivos e de lazer.", "A salvação dos jovens por meio de Jesus Cristo.", "A arrecadação de fundos para a construção de colégios."], "a": 1}, {"n": 4, "q": "Como a Declaração de Missão define a abrangência do ministério jovem em relação aos envolvidos?", "o": ["\"É a parte da obra realizada exclusivamente pelos pastores para os jovens.\"", "\"É a parte da obra da igreja que é realizada PARA OS JOVENS, COM OS JOVENS e PELOS JOVENS.\"", "\"É um clube privado para jovens baptizados.\""], "a": 1}, {"n": 5, "q": "Qual é a PRIMEIRA tarefa descrita na Declaração de Missão do Ministério Jovem?", "o": ["Levar os jovens a se conscientizarem de seu próprio valor e a descobrir e desenvolver seus dons e habilidades espirituais.", "Pagar as despesas da igreja local.", "Aprender a marchar em ordem unida."], "a": 0}, {"n": 6, "q": "Qual é a SEGUNDA tarefa descrita na Declaração de Missão?", "o": ["Capacitar os jovens a uma vida de serviço na igreja de Deus e na comunidade.", "Organizar viagens turísticas internacionais.", "Conseguir empregos seculares para os membros."], "a": 0}, {"n": 7, "q": "Qual é a TERCEIRA tarefa descrita na Declaração de Missão?", "o": ["Assegurar a integração dos jovens em todos os aspectos da vida e da liderança da igreja para que participem plenamente de sua missão.", "Isentar os jovens do estudo da Bíblia.", "Criar um código rígido de punições morais."], "a": 0}, {"n": 8, "q": "Para cumprir nossa tarefa, que tipo de ministério nos comprometemos a levar a cabo segundo a Declaração de Missão?", "o": ["Um ministério focado apenas em música contemporânea.", "Um ministério equilibrado mediante a incorporação da dinâmica bíblica de companheirismo, ensinamento, adoração e missão.", "Um ministério de debates políticos."], "a": 1}, {"n": 9, "q": "Em qual atmosfera a Declaração de Missão afirma que o \"ministério eficaz é possível\"?", "o": ["Numa atmosfera de julgamento, crítica e rigorismo legalista.", "Numa atmosfera de amor, aceitação e perdão.", "Numa atmosfera de competição e prêmios materiais."], "a": 1}, {"n": 10, "q": "Por que a Declaração de Missão afirma que devemos estar dispostos a \"reavaliar projetos e introduzir modificações\"?", "o": ["Porque a Bíblia muda de valor a cada ano.", "Porque reconhecemos a natureza instável da juventude atual e as mudanças do mundo.", "Porque os manuais impressos são caros."], "a": 1}, {"n": 11, "q": "Onde a filosofia do ministério jovem deve buscar sua fonte de inspiração permanente?", "o": ["Nas tendências das redes sociais e do entretenimento secular.", "Na Palavra de Deus e em nossa história profética.", "Nos manuais de empresas multinacionais."], "a": 1}, {"n": 12, "q": "O que a Declaração de Missão sugere fazer periodicamente para garantir que o ministério está no rumo certo?", "o": ["Mudança imediata de toda a comissão do distrito.", "Avaliações periódicas para nos assegurarmos de que estamos alcançando nossos objetivos.", "Aumento das taxas de inscrição."], "a": 1}, {"n": 13, "q": "De acordo com Malcolm Allen no Capítulo 17, há mais de 30 anos trabalhando pelos jovens, o que representa a verdadeira conquista do ministério?", "o": ["O número de prédios ou programas grandes lançados.", "A boa impressão e a transformação causada sobre a vida individual de nossos jovens para a eternidade.", "As fotos publicadas em revistas."], "a": 1}, {"n": 14, "q": "Quais são os TRÊS objetivos pessoais do autor (Malcolm Allen) para o ministério jovem compartilhados no final do livro?", "o": ["1. Apresentar um estilo atraente de vida cristã; 2. Estabelecer uma atmosfera espiritual atraente; 3. Proporcionar um clima para a atuação do Espírito Santo.", "1. Ganhar prêmios; 2. Viajar pelo mundo; 3. Escrever manuais.", "1. Comprar uniformes; 2. Fazer acampamentos; 3. Organizar torneios."], "a": 0}, {"n": 15, "q": "Qual é considerada a MAIOR tarefa dentro do ministério jovem segundo o autor?", "o": ["Arrecadar o orçamento anual do departamento.", "Proporcionar o clima ideal para que o Espírito Santo possa tocar o coração e a vida dos jovens para a eternidade.", "Organizar a ordem unida nos acampamentos."], "a": 1}, {"n": 16, "q": "O que acontece quando a igreja adota cegamente os costumes, práticas e a filosofia do mundo para atrair os jovens?", "o": ["A espiritualidade dos jovens aumenta rapidamente.", "Afasta a espiritualidade dos jovens, diminui a eficiência da igreja e resulta na perda de seus filhos.", "A igreja recebe elogios do governo."], "a": 1}, {"n": 17, "q": "O ministério jovem adventista é uma atividade secundária ou a principal responsabilidade da igreja?", "o": ["É uma atividade opcional de lazer.", "É a principal responsabilidade da igreja na sustentação e continuidade de sua missão bíblica e profética.", "É um projeto exclusivo para os colégios internos."], "a": 1}, {"n": 18, "q": "Qual é a citação bíblica de Jesus lembrada nas últimas linhas do livro para definir a verdadeira essência da mensagem de Elias?", "o": ["\"Buscai primeiro o reino de Deus...\" (Mateus 6:33).", "\"Apascenta minhas ovelhas... Apascenta meus cordeiros\" (João 21:15-17).", "\"Olhai para as aves do céu...\" (Mateus 6:26)."], "a": 1}, {"n": 19, "q": "Quem são os \"cordeiros\" no contexto da ordem de Cristo e da mensagem de Elias para a igreja remanescente?", "o": ["Os membros idosos da igreja.", "As crianças, juvenis e jovens da nossa igreja.", "Os não-crentes de outras cidades."], "a": 1}, {"n": 20, "q": "Qual é a conclusão final do livro \"Salvação e Serviço\" sobre o desafio do Ministério Jovem Adventista?", "o": ["Que o ministério jovem é uma tarefa impossível e deve ser abandonada.", "Que temos um movimento e uma mensagem ordenados por Deus, e com liderança consagrada, fé e fidelidade ao modelo divino, salvaremos nossos jovens e concluiremos a missão!", "Que devemos copiar os métodos das igrejas seculares para ter sucesso."], "a": 1}]}];
